const NAV=[
  {t:'Dashboard',i:'layoutDashboard'},
  {t:'Post a Job',i:'clipboardList',view:'wizard'},
  {t:'My Job Posts',i:'filePlus',view:'jobs'},
  {t:'Candidate Search',i:'search'},
  {t:'Refer Candidates',i:'activity',view:'refer'},
  {t:'Job Marketplace',i:'store',view:'market'},
  {t:'Transactions',i:'wallet',view:'finance'},
  {t:'My Applications',i:'filePlus',view:'apps'},
];
const NAV_BASE="peer/menu-button flex h-8 w-full items-center justify-start gap-3 overflow-hidden whitespace-nowrap rounded-md pl-3 pr-5 py-5 text-left text-[15px] font-normal outline-none ring-sidebar-ring transition-all duration-200 hover:bg-brand-amethyst/10 hover:text-sidebar-accent-foreground focus-visible:ring-2 [&>span:last-child]:truncate";
const NAV_ACTIVE="relative bg-brand-amethyst/10 hover:bg-brand-amethyst/10 text-brand-amethyst [&_svg]:text-brand-amethyst before:absolute before:left-0 before:inset-y-2 before:w-[3px] before:rounded-r before:content-[''] before:bg-[linear-gradient(135deg,hsl(var(--brand-amethyst)),hsl(var(--brand-rose)))]";

let view='wizard', activeJobId=null;

function renderNav(){
  $('sbNav').innerHTML=NAV.map((n,idx)=>{
    const on=(n.view==='jobs'&&(view==='jobs'||view==='pipeline'))
      ||(n.view==='refer'&&(view==='refer'||view==='referjob'))
      ||(n.view&&n.view===view);
    return `<li class="group/menu-item relative"><button data-nav="${idx}" class="${NAV_BASE}${on?' '+NAV_ACTIVE:''}">
      <div class="w-6 flex justify-center">${ic(n.i,'h-[18px] w-[18px] '+(on?'text-brand-amethyst':'text-foreground'))}</div>
      <span class="text-[14px] font-medium">${esc(n.t)}</span></button></li>`;
  }).join('');
  $('sbNav').querySelectorAll('[data-nav]').forEach(el=>el.onclick=()=>{
    const n=NAV[+el.dataset.nav];
    if(n.view)setView(n.view); else toast(n.t,'This screen is outside the scope of this prototype.');
    if(innerWidth<768)closeSb();
  });
}

function setView(v,jobId){
  view=v;
  if(jobId!=null)activeJobId=jobId;
  closeSheet();
  /* Leaving a view drops anything it had open, so a dialog can never outlive
     the board it belongs to. */
  filterOpen=false;closeDlg();
  ['wizard','jobs','pipeline','refer','apps','referjob','profile','market','finance'].forEach(k=>$('view-'+k).classList.add('hidden'));
  $('view-'+v).classList.remove('hidden');
  /* The pipeline (JobDetailWithKanban) and Refer Candidates (ConnectorRecruitmentPipeline)
     own their own scrolling; the others scroll in <main>. */
  const ownsScroll=v==='pipeline'||v==='refer'||v==='referjob';
  $('main').classList.toggle('overflow-y-auto',!ownsScroll);
  $('main').classList.toggle('overflow-hidden',ownsScroll);
  if(v==='wizard')renderStep();
  if(v==='jobs')renderJobs();
  if(v==='pipeline')renderPipeline();
  if(v==='refer')renderRefer();
  if(v==='apps')renderApps();
  if(v==='referjob')renderReferJob();
  if(v==='profile')renderProfile();
  if(v==='market')renderMarket();
  if(v==='finance')renderFinance();
  renderNav();
  $('main').scrollTop=0;
}

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}

/* Recruiter tracker rail — CandidatePipelineTracker + candidate-pipeline-tracker.utils */
const TRACK=[['in_review','In Review'],['shortlisted','Shortlisted'],['interview_invite_sent','Invite Sent'],
             ['interview_scheduled','Interview Scheduled'],['interview_completed','Interview Completed']];
function pipelineStepsFor(stage,ageDays){
  const idx=TRACK.findIndex(([k])=>k===stage);
  return TRACK.map(([step,label],i)=>{
    let status='pending';
    if(stage==='hired')status='completed';
    else if(stage==='rejected'||stage==='not_qualified')status=i===0?'completed':'pending';
    else if(idx>=0)status=i<idx?'completed':(i===idx?'current':'pending');
    return {step,label,status,completedAt:status==='completed'||status==='current'?isoPlus(-(ageDays-i*3)):null};
  }).concat(stage==='hired'?[{step:'hired',label:'Hired',status:'current',completedAt:isoPlus(-2)}]
        :stage==='rejected'?[{step:'rejected',label:'Rejected',status:'current',completedAt:isoPlus(-4)}]:[]);
}

function buildCandidates(job,seed){
  const rnd=mulberry32(seed),pick=a=>a[Math.floor(rnd()*a.length)],int=(lo,hi)=>lo+Math.floor(rnd()*(hi-lo+1));
  const total=int(24,30);
  /* Five hired rows so every payout variant is reachable from a single board. */
  const plan=[['hired',5],['interview_completed',int(1,2)],['interview_scheduled',int(1,3)],
              ['interview_invite_sent',int(1,3)],['shortlisted',int(2,4)],['rejected',int(2,4)]];
  const list=[];plan.forEach(([s,n])=>{for(let i=0;i<n;i++)list.push(s);});
  for(let i=list.length;i<total;i++)list.push(rnd()<0.62?'in_review':'not_qualified');
  let hiredSeen=-1;
  return list.map((stage,i)=>{
    const revealed=REVEALED_STAGES.has(stage);
    const first=pick(FIRST),last=pick(LAST);
    const name=`${first} ${last}`;
    const title=pick(TITLES),company=pick(COMPANIES);
    const years=int(2,15),ageDays=int(12,80);
    const score=stage==='not_qualified'?int(38,58):(stage==='hired'||stage==='interview_completed'?int(84,98):int(58,94));
    const c={
      id:`${job.id}-c${i+1}`, anonymousId:`Candidate #${i+1}`,
      revealedName:revealed?name:null,
      revealedEmail:revealed?`${first}.${last}`.toLowerCase()+'@example.com':null,
      revealedLinkedIn:revealed?`https://www.linkedin.com/in/${first}-${last}`.toLowerCase():null,
      currentTitle:title, currentCompany:company,
      experienceYears:years,
      matchScore:score,
      expectedSalary:job.period==='hour'?int(35,75):int(70,180)*1000,
      referralType:rnd()<0.55?'direct':'public_claim',
      stage, notQualifiedReason:stage==='not_qualified'?pick(NQ_REASONS):null,
      rejectionReason:null, canReinstate:stage==='rejected',
      historyStages:['in_review'],
      createdAt:isoPlus(-ageDays),
      meetingDate:(stage==='interview_scheduled'||stage==='interview_completed'||stage==='hired')?isoPlus(stage==='interview_scheduled'?4:-6):null,
      interviewOutcome:stage==='interview_completed'||stage==='hired'?'completed':null,
      hireDate:stage==='hired'?isoPlus(-int(20,120)):null,
    };
    /* Stages this candidate has actually been through — drives Move Back options. */
    const reached=TRACK.map(([k])=>k);
    const upto=stage==='hired'?reached.length:(stage==='rejected'?int(1,5):reached.indexOf(stage)+1);
    c.historyStages=reached.slice(0,Math.max(1,upto));

    /* --- payout fixtures (only hired rows carry them) --------------------- */
    if(stage==='hired'){
      hiredSeen++;
      c.payoutState=buildPayoutState(job,c,hiredSeen,rnd,pick,int);
      applyPayoutFlags(c);
    }
    c.detail=buildDetail(job,c,ageDays,rnd,pick,int);
    return c;
  });
}

/* Mirrors GET /payout/:candidateId/state. Variant index spreads the five
   recruiter-visible payout states across the Hired column. */
function buildPayoutState(job,c,variant,rnd,pick,int){
  const nConn=rnd()<0.35?2:1;
  const share=c.referralType==='direct'?0.70:0.50;
  const gross=job.perCandidate*10;
  const per=Math.round(gross*share/nConn);
  const V=variant%5;
  const connStatus=['pending','completed','failed','manual_review','pending'][V];
  const candStatus=['pending','pending','completed','onboarding_pending',null][V];
  const blocked=V===0;                 /* still inside the connector waiting window */
  const topUp=V===4?Math.round(gross*0.15):0;  /* fee raised after hire */
  const connectors=Array.from({length:nConn},(_,k)=>{
    const first=pick(FIRST),last=pick(LAST);
    const st=k===0?connStatus:'completed';
    return {
      connectorUserId:`${c.id}-conn${k+1}`,
      name:`${first} ${last}`, role:k===0?'primary':'supporting',
      avatar:null, jobTitle:pick(CONN_TITLES), company:pick(COMPANIES),
      linkedinUrl:`https://www.linkedin.com/in/${first}-${last}`.toLowerCase(),
      classificationType:rnd()<0.5?'internal':'external',
      isActiveEmployee:true,
      payout:{
        status:st, recipientAmount:String(per),
        connectorTopUp:k===0?String(topUp):'0',
        canReleaseNow:k===0?!blocked:false,
        waitEndsAt:k===0&&blocked?isoPlus(11):null,
        completedAt:st==='completed'?isoPlus(-int(2,20)):null,
        updatedAt:isoPlus(-int(1,25)),
        cancellationReason:null, cancellationNotes:null,
      },
    };
  });
  const candidatePayout=candStatus&&job.successFee?{
    status:candStatus, recipientAmount:String(job.successFee),
    candidateTopUp:'0', canReleaseNow:candStatus==='pending'&&V!==0,
    completedAt:candStatus==='completed'?isoPlus(-int(2,15)):null,
    updatedAt:isoPlus(-int(1,20)), cancellationReason:null, cancellationNotes:null,
  }:null;
  return {connectors,candidatePayout,probationEndsAt:isoPlus(V===0?24:-8)};
}

const EDITABLE_PAYOUT=s=>s==='pending'||s==='failed';

/* Card-level booleans the kanban card branches on — recomputed after every
   release so the card flips to its "… Payout Details" state in place. */
function applyPayoutFlags(c){
  const s=c.payoutState;
  if(!s){['hasConnectorPayout','hasPendingConnectorPayouts','hasFailedConnectorPayout','hasManualReviewConnectorPayout',
          'hasCandidatePayout','hasPendingCandidatePayout','hasFailedCandidatePayout','hasManualReviewCandidatePayout',
          'candidatePayoutOnboardingPending'].forEach(k=>c[k]=false);return;}
  const conn=s.connectors.map(x=>x.payout).filter(Boolean);
  c.hasConnectorPayout=conn.length>0;
  c.hasPendingConnectorPayouts=conn.some(p=>p.status==='pending');
  c.hasFailedConnectorPayout=conn.some(p=>p.status==='failed');
  c.hasManualReviewConnectorPayout=conn.some(p=>p.status==='manual_review');
  const cp=s.candidatePayout;
  c.hasCandidatePayout=!!cp;
  c.hasPendingCandidatePayout=cp?.status==='pending';
  c.hasFailedCandidatePayout=cp?.status==='failed';
  c.hasManualReviewCandidatePayout=cp?.status==='manual_review';
  c.candidatePayoutOnboardingPending=cp?.status==='onboarding_pending';
}

/* Mirrors GET /recruitment/candidates/:id — the payload CandidateDetailModal reads. */
function buildDetail(job,c,ageDays,rnd,pick,int){
  const revealed=!!c.revealedName;
  const hidden=['in_review','not_qualified'].includes(c.stage);
  const skills=[...new Set([...job.requiredSkills||[],...Array.from({length:int(5,9)},()=>pick(TECHS))])];
  const matched=skills.slice(0,int(3,5));
  const missing=Array.from({length:int(1,3)},()=>pick(TECHS)).filter(t=>!matched.includes(t));
  const jobHistory=Array.from({length:int(2,4)},(_,k)=>({
    title:k===0?c.currentTitle:pick(TITLES), company:k===0?c.currentCompany:pick(COMPANIES),
    startDate:`${2024-k*3-int(0,1)}`, endDate:k===0?null:`${2024-k*3+2}`, isCurrent:k===0,
  }));
  const [deg,fld]=pick(DEGREES);
  return {
    anonymousLabel:c.anonymousId, stageLabel:(STAGES.find(s=>s.id===c.stage)||{}).label,
    stage:c.stage, detailsRevealed:revealed, createdAt:c.createdAt,
    revealedName:c.revealedName, revealedEmail:c.revealedEmail, revealedLinkedIn:c.revealedLinkedIn,
    currentTitle:c.currentTitle, resumeJobTitle:c.currentTitle, totalYearsExp:c.experienceYears,
    matchScore:c.matchScore, analysisStatus:'completed', analysisNote:null,
    referrer:{name:`${pick(FIRST)} ${pick(LAST)}`,avatar:null},
    hasResume:!hidden, resumeFileName:`${(c.revealedName||c.anonymousId).replace(/[^A-Za-z0-9]+/g,'-')}-Resume.pdf`,
    aiSummary:`${c.experienceYears} years across ${pick(DOMAINS).toLowerCase()}, most recently as ${c.currentTitle} at ${c.currentCompany}. Strongest signal is hands-on delivery ownership; the gap against this role sits in breadth of platform-scale experience.`,
    skills, matchedSkills:matched, missingSkills:missing,
    gapAnalysis:{matchScore:c.matchScore,dimensions:[
      {key:'skills',label:'Skills',matched:matched.map(l=>({label:l,status:'ok'})),gaps:missing.map(l=>({label:l,status:'gap'}))},
      {key:'experience',label:'Experience',matched:[{label:`${c.experienceYears} years relevant`,status:'ok'}],gaps:[]},
    ]},
    resumeMetadata:{
      jobHistory,
      education:[{degree:deg,field:fld,institution:pick(SCHOOLS),year:String(2010+int(0,8))}],
      certifications:Array.from({length:int(1,2)},()=>pick(CERTS)),
      languages:Array.from({length:int(2,3)},()=>{const[l,p]=pick(LANGS);return{language:l,proficiency:p};}),
      tools:Array.from({length:int(3,5)},()=>pick(TOOLS)),
      technologies:Array.from({length:int(4,6)},()=>pick(TECHS)),
      projects:Array.from({length:int(1,3)},()=>{const[n,r,d]=pick(PROJECTS);return{name:n,role:r,description:d,durationMonths:int(4,18),skillsUsed:Array.from({length:3},()=>pick(TECHS))};}),
      domainExpertise:Array.from({length:int(2,3)},()=>pick(DOMAINS)),
    },
    assessmentResponses:ASSESSMENT_QUESTIONS.map((q,k)=>({
      id:`${c.id}-q${k+1}`, questionText:q, questionType:k===0?'text':'single',
      answer:{text:k===0?'Designed a retrieval-augmented assistant on a managed vector store, with an offline eval harness gating every prompt change before release.':null,selectedLabels:k===0?[]:['30 days']},
      options:k===0?[]:[{id:'o1',label:'Immediate'},{id:'o2',label:'30 days'},{id:'o3',label:'60 days'}],
      correctAnswer:k===0?null:{optionIds:['o2']}, isCorrect:k===0?null:c.matchScore>70,
    })),
    transaction:REVEALED_STAGES.has(c.stage)?{
      status:c.stage==='hired'?'captured':'authorized',
      bountyAmount:String(job.perCandidate), providerFee:String((job.perCandidate*0.029).toFixed(2)), processingFee:'0.30',
      totalAmount:String((job.perCandidate*1.029+0.3).toFixed(2)),
      chargeAmount:String(job.perCandidate), fullReferralAmount:String(job.perCandidate*10),
      flatDepositApplied:String(job.perCandidate*2.5), flatTopUpApplied:'0',
      authorizedAt:isoPlus(-ageDays+4), capturedAt:c.stage==='hired'?c.hireDate:null, receiptUrl:null,
    }:null,
    connectors:c.stage==='hired'&&c.payoutState?c.payoutState.connectors.map(x=>({
      connectorUserId:x.connectorUserId,name:x.name,role:x.role,avatar:x.avatar,
      email:x.name.toLowerCase().replace(/\s+/g,'.')+'@example.com',
      jobTitle:x.jobTitle,company:x.company,linkedinUrl:x.linkedinUrl,
    })):[],
    interview:c.meetingDate?{scheduledAt:c.meetingDate,meetingLink:'https://meet.google.com/abc-defg-hij',notes:'45-minute technical deep dive with the hiring manager.'}:null,
    pipelineSteps:pipelineStepsFor(c.stage,ageDays),
    emailLogs:buildEmailLogs(c,int,pick),
  };
}

function buildEmailLogs(c,int,pick){
  const upto=c.stage==='rejected'?5:(c.stage==='hired'?4:Math.min(4,c.historyStages.length+1));
  return EMAIL_TYPES.slice(0,Math.max(1,upto)).map((e,k)=>({
    id:`${c.id}-m${k+1}`, emailType:e[0], subject:e[1], recipientType:e[2],
    status:k===2&&c.matchScore<65?'bounced':'delivered',
    sentAt:isoPlus(-(20-k*3)), canResend:k>=1,
  }));
}

const SKILL_SUGGESTIONS=['Strategic Planning','Stakeholder Management','Machine Learning','System Design','Mentoring','Cloud Architecture'];
const FIRST_SHORTLIST_PCT=25;

function computeFees(){
  const flat=num(data.flatFee), first=flat*FIRST_SHORTLIST_PCT/100;
  return {flat,first,onHire:flat-first,stripe:first*0.029+0.30};
}
function compactSalary(){
  const lo=num(data.salaryRangeMin), hi=num(data.salaryRangeMax);
  if(!lo||!hi)return '';
  const c=n=>n>=1000?'$'+(n/1000).toFixed(n%1000?1:0)+'K':'$'+n;
  return `${c(lo)} – ${c(hi)}`;
}

/* ============================================================================
   WIZARD BEHAVIOUR
   ============================================================================ */
function validate(){
  if(cur===STEP.job_details){
    if(!data.companyName.trim()||!data.title.trim()||!data.location.trim()){toast('Missing details','Please fill company, title and location.');return false;}
    if(!data.countries.length){toast('Missing country','Select at least one country for this role.');return false;}
  }
  if(cur===STEP.skills&&!data.requiredSkills.length){toast('Add skills','Add at least 1 required skill to continue.');return false;}
  if(cur===STEP.description&&(data.description||'').length<50){toast('Description too short','Job description needs at least 50 characters.');return false;}
  if(cur===STEP.budget_pricing_model&&num(data.flatFee)<=0){toast('Set a referral fee','Enter the flat fee paid when you hire a candidate.');return false;}
  if(cur===STEP.payment&&!data.hasPaymentMethod){toast('Save payment','Please save a payment method to continue.');return false;}
  return true;
}
function goNext(){
  if(!validate())return;
  if(cur===LAST_STEP){toast('Published!','Your job post is now live on the marketplace.');return;}
  cur++;renderStep();$('main').scrollTop=0;
}

function bindStep(){
  const root=$('view-wizard');
  const on=(id,ev,fn)=>{const el=$(id);if(el)el[ev]=fn;};

  root.querySelectorAll('[data-step]').forEach(el=>el.onclick=()=>{const i=+el.dataset.step;if(i<=cur){cur=i;renderStep();}});
  on('wBack','onclick',()=>{if(cur>0){cur--;renderStep();$('main').scrollTop=0;}});
  on('wReset','onclick',()=>toast('Reset','This step has been reset to defaults.'));
  on('wNext','onclick',goNext);
  on('wPublishSide','onclick',goNext);
  on('wPreview','onclick',()=>openSheet(livePreviewPanel()));

  /* Method */
  root.querySelectorAll('[data-method]').forEach(el=>el.onclick=()=>{data.method=el.dataset.method;renderStep();});

  /* Job Details */
  const text=(id,key)=>on(id,'oninput',()=>{data[key]=$(id).value;});
  text('f-company','companyName');text('f-title','title');text('f-location','location');
  const pick=(id,key)=>on(id,'onchange',()=>{data[key]=$(id).value;});
  pick('f-industry','industry');pick('f-dept','department');pick('f-exp','experienceLevel');
  pick('f-work','workType');pick('f-emp','employmentType');
  on('f-country','onchange',()=>{const v=$('f-country').value;if(v&&!data.countries.includes(v))data.countries.push(v);renderStep();});
  root.querySelectorAll('[data-rmctry]').forEach(el=>el.onclick=()=>{data.countries=data.countries.filter(c=>c!==el.dataset.rmctry);renderStep();});

  /* Skills */
  const addSkill=(kind,v)=>{v=(v||'').trim();if(!v)return;const arr=kind==='req'?data.requiredSkills:data.preferredSkills;if(!arr.includes(v))arr.push(v);renderStep();};
  on('reqAdd','onclick',()=>addSkill('req',$('reqInput').value));
  on('prefAdd','onclick',()=>addSkill('pref',$('prefInput').value));
  on('reqInput','onkeydown',e=>{if(e.key==='Enter'){e.preventDefault();addSkill('req',e.target.value);}});
  on('prefInput','onkeydown',e=>{if(e.key==='Enter'){e.preventDefault();addSkill('pref',e.target.value);}});
  root.querySelectorAll('[data-rm]').forEach(el=>el.onclick=()=>{
    const k=el.dataset.rm,v=el.dataset.val;
    if(k==='req')data.requiredSkills=data.requiredSkills.filter(s=>s!==v);
    else data.preferredSkills=data.preferredSkills.filter(s=>s!==v);
    renderStep();});
  root.querySelectorAll('[data-sug]').forEach(el=>el.onclick=()=>addSkill('req',el.dataset.sug));

  /* Description */
  root.querySelectorAll('[data-acc]').forEach(el=>el.onclick=()=>{
    openAccordion=openAccordion===el.dataset.acc?null:el.dataset.acc;renderStep();});
  root.querySelectorAll('[data-desc]').forEach(el=>el.oninput=()=>{
    data[el.dataset.desc]=el.value;
    const counter=el.closest('.group').querySelector('.font-mono');
    if(counter)counter.textContent=`${el.value.length} / 5000`;});
  on('genAI','onclick',()=>toast('Generating…','AI is drafting a description from your job details.'));

  /* Assessment */
  on('assessToggle','onclick',()=>{data.hasAssessment=!data.hasAssessment;renderStep();});
  const addQ=v=>{v=(v||'').trim();if(!v)return;data.questions.push(v);renderStep();};
  on('qAdd','onclick',()=>addQ($('qInput').value));
  on('qInput','onkeydown',e=>{if(e.key==='Enter'){e.preventDefault();addQ(e.target.value);}});
  root.querySelectorAll('[data-rmq]').forEach(el=>el.onclick=()=>{data.questions.splice(+el.dataset.rmq,1);renderStep();});

  /* Budget — derived numbers refresh in place so the caret never jumps */
  on('f-flatfee','oninput',()=>{
    data.flatFee=$('f-flatfee').value;const f=computeFees();
    const set=(id,v)=>{const e=$(id);if(e)e.textContent=v;};
    set('feeTotal',money2(f.flat));set('feeBalance',money2(f.onHire));set('feeStripe',money2(f.stripe));set('feeFirst',money2(f.first));});
  text('f-salmin','salaryRangeMin');text('f-salmax','salaryRangeMax');
  pick('f-currency','salaryCurrency');pick('f-salperiod','salaryPeriod');
  on('f-salnotes','oninput',()=>{data.salaryRangeNotes=$('f-salnotes').value;
    const c=$('salNotesCount');if(c)c.textContent=`${data.salaryRangeNotes.length}/255`;});

  /* Connector payout */
  root.querySelectorAll('[data-pay]').forEach(el=>el.onclick=()=>{
    if(el.dataset.pay==='emp')data.payEmployee=el.dataset.val;else data.payOutside=el.dataset.val;
    renderStep();});
  on('f-waitdays','oninput',()=>{
    data.waitDays=$('f-waitdays').value;
    const wait=String(data.waitDays).trim()?`the ${data.waitDays}-day wait period`:'the wait period';
    root.querySelectorAll('[data-val="after"] .payout-sub').forEach(s=>s.textContent='Held until '+wait);
    const sum=$('payoutSummary');if(sum)sum.innerHTML=payoutSummaryText();});

  /* Success fees */
  on('feeToggle','onclick',()=>{data.hasSuccessFee=!data.hasSuccessFee;renderStep();});
  text('f-feeamt','successFeeAmount');text('f-probation','probationPeriodDays');

  /* Payment */
  on('savePay','onclick',()=>{data.hasPaymentMethod=true;renderStep();toast('Card added','Your payment method has been saved and set as default.');});
  on('changePay','onclick',()=>{data.hasPaymentMethod=false;renderStep();});

  /* Notify */
  on('notifyToggle','onclick',()=>{data.notify=!data.notify;renderStep();});
  root.querySelectorAll('[data-rmorg]').forEach(el=>el.onclick=()=>{data.orgs=data.orgs.filter(o=>o!==el.dataset.rmorg);renderStep();});
}

/* --- kebab dropdown (ui/dropdown-menu.tsx) -------------------------------- */
const DD_ITEM="relative flex cursor-pointer select-none items-center rounded-md px-2 py-1.5 text-sm outline-none transition-colors focus:bg-brand-amethyst/10 focus:text-brand-amethyst hover:bg-brand-amethyst/10 hover:text-brand-amethyst";
function closeMenu(){$('menuLayer').innerHTML='';}
function openKebab(jobId,anchor){
  const job=JOBS.find(j=>j.id===jobId);
  const item=(action,icon,label,extra)=>`<div role="menuitem" data-jobact="${action}" data-job="${jobId}" class="${DD_ITEM} ${extra||''}">${ic(icon,'mr-2 h-4 w-4')}${label}</div>`;
  const sep='<div class="-mx-1 my-1 h-px bg-muted"></div>';
  const body=job.status==='closed'
    ? item('view','eye','View')+item('collaborators','users','Manage Collaborators')+sep+item('reopen','rotateCcw','Reopen Job Post')
    : item('edit','edit','Edit')+item('collaborators','users','Manage Collaborators')
      +item('notify','send',job.notified?'Resend Notification':'Send Notification')
      +sep+item('close','ban','Close Job Post','text-brand-destructive focus:text-brand-destructive hover:text-brand-destructive');
  const r=anchor.getBoundingClientRect();
  $('menuLayer').innerHTML=`<div class="fixed inset-0 z-[75]" data-menubackdrop></div>
    <div role="menu" style="top:${Math.round(r.bottom+4)}px;left:${Math.round(r.right)}px;transform:translateX(-100%)"
      class="fixed z-[80] min-w-[8rem] overflow-hidden rounded-md border bg-popover p-1 text-popover-foreground shadow-lg">${body}</div>`;
  $('menuLayer').querySelector('[data-menubackdrop]').onclick=closeMenu;
  $('menuLayer').querySelectorAll('[data-jobact]').forEach(el=>el.onclick=()=>{
    const a=el.dataset.jobact;closeMenu();
    if(a==='collaborators')return openCollab(jobId);
    if(a==='view'||a==='edit')return a==='view'?setView('pipeline',jobId):setView('wizard');
    toast(job.title,a==='notify'?'Notification queued for the selected organizations.':(a==='close'?'Close Job Post opens the close-reason dialog.':'Reopen Job Post'));
  });
}
addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenu();if(removeTarget){removeTarget=null;renderCollab();}else if(collabJobId)closeCollab();}});

/* --- Manage Collaborators modal ------------------------------------------- */
let collabJobId=null, collabTab='add', collabRole='candidate_manager',
    collabSearch='', collabSelected=new Set(), collabNotify=true, showPerms=false, removeTarget=null;

function openCollab(jobId){
  collabJobId=jobId;collabTab='add';collabSearch='';collabSelected=new Set();
  collabNotify=true;showPerms=false;removeTarget=null;renderCollab();
}
function closeCollab(){collabJobId=null;removeTarget=null;$('modalLayer').innerHTML='';}

function renderCollab(){
  if(!collabJobId){$('modalLayer').innerHTML='';return;}
  const job=JOBS.find(j=>j.id===collabJobId);
  const roster=collabsFor(collabJobId);
  const rosterIds=new Set(roster.map(c=>c.id));
  const q=collabSearch.trim().toLowerCase();
  const members=ORG_MEMBERS.filter(m=>!rosterIds.has(m.id))
    .filter(m=>!q||[m.fullName,m.email,m.jobTitle].join(' ').toLowerCase().includes(q));
  const role=COLLAB_ROLES.find(r=>r.id===collabRole);

  const tabBtn=(id,icon,label,badge)=>`<button data-ctab="${id}" data-state="${collabTab===id?'active':'inactive'}"
    class="group inline-flex flex-1 items-center justify-center gap-2 rounded-lg px-3 py-1.5 text-sm font-semibold transition-all ${collabTab===id?'bg-card text-brand-amethyst shadow-sm':'text-muted-foreground hover:text-foreground'}">
    ${ic(icon,'h-4 w-4 shrink-0')}<span class="whitespace-nowrap">${label}</span>
    ${badge!=null?`<span class="${BADGE} ml-1 rounded-full border-0 px-2 py-0.5 text-[11px] font-bold ${collabTab===id?'bg-brand-amethyst/10 text-brand-amethyst':'bg-card text-muted-foreground'}">${badge}</span>`:''}</button>`;

  const avatar=(m,cls)=>`<span class="relative flex ${cls||'h-8 w-8'} shrink-0 overflow-hidden rounded-full">
    <span class="flex h-full w-full items-center justify-center rounded-full bg-muted text-xs font-medium">${initials(m.fullName,m.email)}</span></span>`;
  const check=on=>`<span class="grid h-4 w-4 shrink-0 place-items-center rounded-sm border border-primary ${on?'bg-primary text-primary-foreground':''}">${on?ic('check','h-3 w-3'):''}</span>`;

  const addTab=`<div class="mt-5 min-h-[320px] space-y-3">
    <div class="space-y-2 rounded-lg border border-border bg-muted/30 p-3">
      <label class="${LABEL} text-xs font-semibold uppercase tracking-wider text-muted-foreground">Role</label>
      <select id="collabRole" class="${SELECT}">${COLLAB_ROLES.map(r=>`<option value="${r.id}"${collabRole===r.id?' selected':''}>${prettifyRoleName(r.name)}</option>`).join('')}</select>
      ${role&&role.permissions.length?`
      <button id="permsToggle" class="flex items-center gap-1 text-xs font-medium text-muted-foreground transition-colors hover:text-foreground">
        ${ic('chevronRight','h-3.5 w-3.5 transition-transform '+(showPerms?'rotate-90':''))}What can this role do?</button>
      ${showPerms?`<div class="grid grid-cols-2 gap-x-3 gap-y-1 pt-2">${role.permissions.map(p=>
        `<span class="flex items-center gap-1.5 text-xs text-foreground">${ic('checkCircle2','h-3.5 w-3.5 shrink-0 text-emerald-600')}<span class="truncate">${permissionLabel(p)}</span></span>`).join('')}</div>`:''}`:''}
    </div>
    <div class="relative">
      <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground">${ic('search','h-4 w-4')}</span>
      <input id="collabSearch" value="${esc(collabSearch)}" placeholder="Search your organization members" class="${INPUT} pl-9">
    </div>
    <div class="max-h-[300px] space-y-1 overflow-y-auto thin-scroll">
      ${members.length?members.map(m=>`<label data-pick="${m.id}" class="flex cursor-pointer items-center gap-3 rounded-lg px-2 py-1.5 transition-colors hover:bg-muted/60">
        ${check(collabSelected.has(m.id))}${avatar(m)}
        <div class="min-w-0 flex-1">
          <p class="truncate text-sm font-medium text-foreground">${esc(m.fullName)}</p>
          <p class="truncate text-xs text-muted-foreground">${esc(m.jobTitle)}</p>
        </div></label>`).join('')
      :'<p class="px-1 py-6 text-center text-sm text-muted-foreground">No eligible members found.</p>'}
    </div>
    <label id="collabNotify" class="mt-2 flex cursor-pointer items-center gap-2 border-t border-border pt-4 text-sm text-muted-foreground">
      ${check(collabNotify)}Send an email to let them know they&#39;ve been added</label>
  </div>`;

  const currentTab=`<div class="mt-5 min-h-[320px] space-y-3">
    ${roster.length?`<div class="space-y-2">${roster.map(c=>`
      <div class="flex items-center gap-3 rounded-lg border border-border bg-card px-3 py-2">
        ${avatar(c)}
        <div class="min-w-0 flex-1">
          <p class="truncate text-sm font-medium text-foreground">${esc(c.fullName)}</p>
          <p class="truncate text-xs text-muted-foreground">${esc(c.email)}</p>
        </div>
        <span class="${BADGE} ${BADGE_OUTLINE} hidden shrink-0 text-[10px] uppercase tracking-wider sm:inline-flex">${esc(c.roleName.replace(/_/g,' '))}</span>
        <button data-rmcollab="${c.id}" class="${btn('ghost','icon','h-8 w-8 shrink-0 text-muted-foreground hover:text-brand-destructive')}">${ic('trash','h-4 w-4')}</button>
      </div>`).join('')}</div>`
    :'<p class="rounded-lg border border-dashed border-border px-3 py-6 text-center text-sm text-muted-foreground">No collaborators yet. Switch to the Add tab to add a co-worker.</p>'}
  </div>`;

  $('modalLayer').innerHTML=`
  <div class="fixed inset-0 z-[70] bg-black/40 backdrop-blur-[4px]" data-collabbackdrop></div>
  <div role="dialog" aria-modal="true"
    class="fixed left-[50%] top-[50%] z-[70] flex max-h-[92vh] w-full max-w-xl -translate-x-1/2 -translate-y-1/2 flex-col gap-0 overflow-hidden bg-background p-0 shadow-lg sm:rounded-2xl max-sm:inset-0 max-sm:left-0 max-sm:top-0 max-sm:h-full max-sm:max-h-full max-sm:translate-x-0 max-sm:translate-y-0 max-sm:rounded-none">
    <div class="relative shrink-0 overflow-hidden bg-brand-hero-gradient p-6 text-white sm:p-7">
      <div aria-hidden class="pointer-events-none absolute inset-0 bg-brand-hero-overlay"></div>
      <button id="collabClose" class="absolute right-4 top-4 z-10 grid h-8 w-8 place-items-center rounded-lg bg-white/15 text-white transition-colors hover:bg-white/25">${ic('x','h-4 w-4')}</button>
      <div class="relative flex items-center gap-3.5 pr-10">
        <div class="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-white/20 backdrop-blur">${ic('users','h-5 w-5')}</div>
        <div class="min-w-0">
          <h2 class="text-xl font-extrabold tracking-tight text-white">Manage Collaborators</h2>
          <div class="mt-1 text-[13px] leading-relaxed text-white/90">Add co-workers to help manage candidates for <span class="font-semibold text-white">${esc(job.title)}</span>. They can't edit job details.</div>
        </div>
      </div>
    </div>
    <div class="flex min-h-0 flex-1 flex-col">
      <div class="flex-1 overflow-y-auto p-5 thin-scroll sm:p-6">
        <div class="inline-flex h-10 w-full items-center gap-1 rounded-xl border border-border bg-muted p-1">
          ${tabBtn('add','user','Add',null)}${tabBtn('current','users','Current',roster.length)}
        </div>
        ${collabTab==='add'?addTab:currentTab}
      </div>
      ${collabTab==='add'?`<div class="flex shrink-0 items-center justify-between gap-3 border-t border-border bg-card p-4">
        <span class="text-xs text-muted-foreground">${collabSelected.size>0
          ?`${collabSelected.size} selected · <button id="collabClear" class="underline transition-colors hover:text-foreground">Clear</button>`
          :`${members.length} of ${ORG_MEMBERS.length-roster.length} shown`}</span>
        <button id="collabAdd" ${collabSelected.size?'':'disabled'} class="${btn('default','default',PRIMARY_BTN)}">${ic('user','mr-1.5 h-4 w-4')}Add${collabSelected.size?' '+collabSelected.size:''} selected</button>
      </div>`:''}
    </div>
  </div>
  ${removeTarget?`
  <div class="fixed inset-0 z-[80] bg-black/40 backdrop-blur-[4px]" data-rmbackdrop></div>
  <div role="alertdialog" class="fixed left-[50%] top-[50%] z-[80] grid w-full max-w-lg -translate-x-1/2 -translate-y-1/2 gap-4 rounded-xl border bg-background p-6 shadow-lg">
    <div class="flex flex-col gap-2 text-center sm:text-left">
      <h2 class="text-lg font-semibold">Remove collaborator?</h2>
      <p class="text-sm text-muted-foreground">${esc(removeTarget.fullName||removeTarget.email)} will immediately lose access to this job and its candidates. You can re-add them later.</p>
    </div>
    <div class="flex flex-col-reverse sm:flex-row sm:justify-end sm:space-x-2">
      <button id="rmCancel" class="${btn('outline','default','mt-2 sm:mt-0')}">Cancel</button>
      <button id="rmConfirm" class="${btn('default','default','bg-brand-destructive text-brand-foreground hover:bg-brand-destructive/90')}">Remove</button>
    </div>
  </div>`:''}`;

  const L=$('modalLayer');
  L.querySelector('[data-collabbackdrop]').onclick=()=>{if(!removeTarget)closeCollab();};
  $('collabClose').onclick=closeCollab;
  L.querySelectorAll('[data-ctab]').forEach(el=>el.onclick=()=>{collabTab=el.dataset.ctab;renderCollab();});
  if($('collabRole'))$('collabRole').onchange=()=>{collabRole=$('collabRole').value;renderCollab();};
  if($('permsToggle'))$('permsToggle').onclick=()=>{showPerms=!showPerms;renderCollab();};
  if($('collabSearch'))$('collabSearch').oninput=()=>{
    collabSearch=$('collabSearch').value;renderCollab();
    const el=$('collabSearch');el.focus();el.setSelectionRange(el.value.length,el.value.length);};
  L.querySelectorAll('[data-pick]').forEach(el=>el.onclick=e=>{
    e.preventDefault();const id=el.dataset.pick;
    collabSelected.has(id)?collabSelected.delete(id):collabSelected.add(id);renderCollab();});
  if($('collabNotify'))$('collabNotify').onclick=e=>{e.preventDefault();collabNotify=!collabNotify;renderCollab();};
  if($('collabClear'))$('collabClear').onclick=()=>{collabSelected=new Set();renderCollab();};
  if($('collabAdd'))$('collabAdd').onclick=()=>{
    if(!collabSelected.size)return;
    const n=collabSelected.size;
    COLLABORATORS[collabJobId]=(COLLABORATORS[collabJobId]||[])
      .concat([...collabSelected].map(id=>({id,roleName:collabRole})));
    collabSelected=new Set();collabTab='current';renderCollab();renderJobs();
    toast('Collaborators added',`${n} co-worker${n===1?'':'s'} added as ${prettifyRoleName(collabRole)}${collabNotify?' and notified by email':''}.`);};
  L.querySelectorAll('[data-rmcollab]').forEach(el=>el.onclick=()=>{
    removeTarget=collabsFor(collabJobId).find(c=>c.id===el.dataset.rmcollab);renderCollab();});
  if($('rmCancel'))$('rmCancel').onclick=()=>{removeTarget=null;renderCollab();};
  if($('rmConfirm'))$('rmConfirm').onclick=()=>{
    const name=removeTarget.fullName;
    COLLABORATORS[collabJobId]=COLLABORATORS[collabJobId].filter(c=>c.id!==removeTarget.id);
    removeTarget=null;renderCollab();renderJobs();
    toast('Collaborator removed',`${name} no longer has access to this job.`);};
}

function salaryRangeLabel(j){

function jobCard(j){

            <div class="hidden shrink-0 items-center gap-2 md:flex">${routeSearchInput(o.searchId,o.search,o.placeholder,'w-64 lg:w-80')}</div>
            <button data-psearch="1" aria-label="Search" class="${btn('outline','none','h-10 flex-1 gap-2 rounded-xl border border-border bg-card px-3 shadow-sm transition-all hover:border-brand-amethyst/20 hover:bg-brand-amethyst/10 hover:text-brand-amethyst md:hidden')}">${ic('search','h-4 w-4')}Search</button>

/* Wires a rendered tabs bar. `state` carries {tab,q}; `rerender` redraws the view. */
function bindPipelineTabs(root,state,rerender,searchId){
  root.querySelectorAll('[data-ptab]').forEach(el=>el.onclick=()=>{
    if(state.tab===el.dataset.ptab)return;
    state.tab=el.dataset.ptab;rerender();});
  root.querySelectorAll('[data-prefresh]').forEach(el=>el.onclick=()=>toast('Refreshed','Everything here is up to date.'));
  root.querySelectorAll('[data-psearch]').forEach(el=>el.onclick=()=>{
    const box=$(searchId);if(box){box.scrollIntoView({block:'nearest'});box.focus();}});
  root.querySelectorAll('[data-clear]').forEach(el=>el.onclick=()=>{state.q='';rerender();});
  const s=$(searchId);
  /* innerHTML replacement drops focus, so the caret is restored by hand. */
  if(s)s.oninput=()=>{state.q=s.value;rerender();const el=$(searchId);
    if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}};
}

/* utils/candidateApplicationTimelineLabel.ts — candidate-facing timeline copy */
function timelineLabel(status,note){
  const n=(note||'').trim(), l=n.toLowerCase();
  if(l.includes('application submitted')||l.includes('via consent'))return 'You have successfully applied for this job.';
  if(l.includes('moved back to')&&l.includes('from rejected')){
    if(status==='in_review')return 'Your application was reopened after a previous decision and is under review again.';
    if(status==='shortlisted')return 'Your application was reopened after a previous decision and moved back to the shortlist.';
    if(status==='interview_invite_sent')return 'Your application was reopened. You may schedule your interview again — please check for a new invite.';
    if(status==='interview_scheduled')return 'Your application was reopened and your interview slot has been restored.';
    if(status==='interview_completed')return 'Your application was reopened at the interview stage for further review.';
    return 'Your application was reopened after a previous decision and the hiring process continues.';
  }
  if(status==='processing')return 'We are reviewing your application and checking how well your profile matches the job.';
  if(l.includes('not eligible for this job'))return 'Unfortunately, your profile was not selected for this role.';
  if(l.includes('eligible for this job'))return "Good news! Your profile matches what we're looking for.";
  if(status==='shortlisted'||l.includes('shortlisted'))return 'You have been shortlisted for the next stage of the hiring process.';
  if(l.includes('interview invite resent')||l.includes('interview invite sent'))return "We've invited you to schedule an interview at your convenience.";
  if(l.includes('interview booked by candidate'))return 'Your interview has been successfully scheduled.';
  if(l.includes('interview rescheduled'))return 'Your interview was rescheduled.';
  if(status==='interview_completed')return "Your interview is complete. We'll get back to you soon.";
  if(status==='rejected'||status==='jd_mismatched')return 'Thank you for your time. We will not be moving forward at this stage.';
  return n||status;
}

  interview_scheduled:[['applied','Application submitted'],['processing','Resume analysis started'],['under_review','Candidate is eligible for this job'],['shortlisted','Shortlisted by recruiter'],['interview_invite_sent','Interview invite sent'],['interview_scheduled','Interview booked by candidate']],
  offer_received:[['applied','Application submitted'],['under_review','Candidate is eligible for this job'],['shortlisted','Shortlisted by recruiter'],['interview_scheduled','Interview booked by candidate'],['interview_completed','Interview completed'],['offer_received','Offer extended']],
  offer_accepted:[['applied','Application submitted'],['under_review','Candidate is eligible for this job'],['shortlisted','Shortlisted by recruiter'],['interview_completed','Interview completed'],['offer_received','Offer extended'],['offer_accepted','Congratulations! You accepted the offer']],
  rejected:[['applied','Application submitted'],['under_review','Candidate is eligible for this job'],['shortlisted','Shortlisted by recruiter'],['interview_completed','Interview completed'],['rejected','Not selected for this role']],
  jd_mismatched:[['applied','Application submitted'],['processing','Resume analysis started'],['jd_mismatched','Candidate is not eligible for this job']],
};
const APPLICATIONS=APP_SEED.map((s,i)=>{
  const j=JOBS.find(x=>x.id===s.job);
  const steps=APP_TIMELINE[s.status]||APP_TIMELINE.applied;
  const span=Math.max(1,Math.floor(s.age/Math.max(1,steps.length-1)));
  return {
    id:'a'+(i+1), jobId:j.id, jobTitle:j.title, companyName:j.company, location:j.location,
    description:j.desc, workType:j.workType, employmentType:j.employment, experienceLevel:j.experience,
    salaryMin:j.salMin, salaryMax:j.salMax, salaryCurrency:j.currency, salaryPeriod:j.period,
    status:s.status, appliedAt:isoPlus(-s.age), lastUpdatedAt:isoPlus(-Math.max(0,s.age-(steps.length-1)*span)),
    analysisStatus:s.analysis||(s.score!=null?'completed':null),
    retryCount:s.retries||0, bonus:s.bonus||null,
    interviewScheduledAt:s.interview?s.interview.at:null, interviewType:s.interview?s.interview.type:null,
    interviewLocation:s.interview?s.interview.location||null:null, meetingLink:s.interview?s.interview.link||null:null,
    gap:s.score!=null?{score:s.score,matched:s.matched||[],gaps:s.gaps||[]}:null,
    timeline:steps.map((t,k)=>({status:t[0],date:isoPlus(-s.age+k*span),note:t[1]})),
  };
});

                    ['51-60','51–60%'],['61-70','61–70%'],['71-80','71–80%'],['81-90','81–90%'],['91-100','91–100%']];

  if(!ranges.length)return true;

/* Advance a candidate and repaint both the board and any open dialog. */
function moveStage(c,stage,extra){
  if(!c.historyStages.includes(c.stage)&&c.stage!=='rejected')c.historyStages.push(c.stage);
  Object.assign(c,{stage},extra||{});
  c.detail.stage=stage;
  c.detail.stageLabel=(STAGES.find(s=>s.id===stage)||{}).label;
  c.detail.pipelineSteps=pipelineStepsFor(stage,20);

}

const CA="h-auto gap-1.5 rounded-[9px] px-2.5 py-[7px] text-xs font-bold transition-all";

const CA_REJECT=`${BTN} ${BTN_VAR.outline} ${CA} hover:border-red-400 hover:bg-red-50 hover:text-red-600`;

const CA_PRIMARY=`${BTN} ${CA} border-transparent bg-brand-gradient text-white shadow-brand-cta hover:-translate-y-px hover:text-white`;
/* Retry sits on a failed payout — red, so it never reads as the happy path. */

/* Emails is available on every recruiter stage (RECRUITER_EMAIL_LOG_STAGES). */
const REJECTABLE=new Set(['in_review','shortlisted','interview_invite_sent','interview_completed','not_qualified']);

function candidateActions(c){
  const b=(cls,icon,label,act,extra)=>`<button data-act="${act}" data-cand="${c.id}" class="${cls} ${extra||''}">${ic(icon,'h-3.5 w-3.5')} ${label}</button>`;
  const rows=[];

  /* View + Emails share the top row. */
  rows.push(`<div class="grid grid-cols-2 gap-[7px]">
    ${b(CA_NEUTRAL,'eye','View','view','min-w-0 w-full')}
    ${b(CA_NEUTRAL,'mail','Emails','emails','min-w-0 w-full')}
  </div>`);

  const isHired=c.stage==='hired';
  const showReject=REJECTABLE.has(c.stage);
  const showEdit=isHired&&c.hasPendingConnectorPayouts;
  const showReschedule=c.stage==='interview_scheduled';
  if(showReject||showEdit||showReschedule){
    rows.push(`<div class="flex gap-[7px]">
      ${showReject?b(CA_REJECT,'thumbsDown','Reject','reject','min-w-0 flex-1'):''}
      ${showEdit?b(CA_NEUTRAL,'pencil','Edit','editclass','min-w-0 flex-1'):''}
      ${showReschedule?b(CA_NEUTRAL,'calendar','Reschedule','interview','min-w-0 flex-1'):''}
    </div>`);
  }

  if(c.stage==='in_review'||c.stage==='not_qualified')rows.push(b(CA_PRIMARY,'thumbsUp','Shortlist','shortlist','w-full'));
  if(c.stage==='shortlisted')rows.push(b(CA_PRIMARY,'calendar','Schedule','interview','w-full'));
  if(c.stage==='interview_invite_sent')rows.push(b(CA_RESEND,'send','Resend','interview','w-full'));
  if(c.stage==='interview_scheduled')rows.push(b(CA_PRIMARY,'checkCircle','Mark Outcome','outcome','w-full'));
  if(c.stage==='interview_completed')rows.push(b(CA_PRIMARY,'badgeCheck','Move to Hired','hire','w-full'));
  if(c.stage==='rejected'&&c.canReinstate)rows.push(b(CA_PRIMARY,'rotateCcw','Move Back to Stage','reinstate','w-full'));

  /* Hired: connector and candidate payouts release independently, and each
     button persists after release as a read-only details view. */
  const payoutRow=(scope,hasRow,pending,failed,manual,releaseLabel,detailsLabel)=>{
    if(!hasRow)return '';
    const badge=failed?`<span class="${BADGE} w-full justify-center gap-1 border-red-200 bg-red-50 py-1 text-[11px] font-semibold text-red-700">${ic('alertTriangle','h-3.5 w-3.5')} Payout Failed</span>`
      :manual?`<span class="${BADGE} w-full justify-center gap-1 border-amber-200 bg-amber-50 py-1 text-[11px] font-semibold text-amber-700">${ic('alertTriangle','h-3.5 w-3.5')} Needs Manual Review</span>`:'';
    const btnHtml=pending?b(CA_PRIMARY,'wallet',releaseLabel,'payout:'+scope,'w-full')
      :failed?b(CA_RETRY,'rotateCcw','Retry Payout','payout:'+scope,'w-full')
      :b(CA_NEUTRAL,'receipt',detailsLabel,'payout:'+scope,'w-full');
    return badge+btnHtml;
  };
  if(isHired){
    rows.push(payoutRow('connector',c.hasConnectorPayout,c.hasPendingConnectorPayouts,c.hasFailedConnectorPayout,
      c.hasManualReviewConnectorPayout,'Release Connector Payout','Connector Payout Details'));
    rows.push(payoutRow('candidate',c.hasCandidatePayout,c.hasPendingCandidatePayout,c.hasFailedCandidatePayout,
      c.hasManualReviewCandidatePayout,'Release Candidate Bonus','Candidate Payout Details'));
  }
  return rows.filter(Boolean).join('');
}

function headerMeta(job){
  const per=(job.period||'year').toLowerCase();
  const money=n=>job.period==='hour'?`$${n}`:`$${commas(n)}`;
  return [job.company,job.location,
    (job.salMin&&job.salMax)?`${money(job.salMin)} – ${money(job.salMax)} / ${per}`:null,
    `Payout: $${commas(job.perCandidate)}`].filter(Boolean);
}

function visibleStages(){
  return STAGES.filter(s=>!stageFilter.length||stageFilter.includes(s.id));
}
function filterCandidates(list){
  const q=pipeQuery.trim().toLowerCase();
  return list.filter(c=>inRanges(c.matchScore,matchRanges))
    .filter(c=>!q||[c.revealedName||'',c.anonymousId,c.currentTitle,c.currentCompany,...(c.detail.skills||[])]

}

const REJECTION_CATEGORIES=['Not a fit','Position filled','Insufficient experience','Overqualified','Cultural mismatch','Salary expectations','Other'];
const MIN_NOTE_LENGTH=50;

function dlgReject(c){
  const cat=MODAL.cat||'', note=MODAL.note||'', touched=MODAL.touched||{};
  const trimmed=note.trim();
  const noteError=touched.note&&trimmed.length<MIN_NOTE_LENGTH
    ?`Minimum ${MIN_NOTE_LENGTH} characters required (${trimmed.length}/${MIN_NOTE_LENGTH})`:'';
  const catError=touched.cat&&!cat?'Please select a reason':'';
  const valid=!!cat&&trimmed.length>=MIN_NOTE_LENGTH;
  return {html:dlgShell({
    icon:'xCircle', title:'Reject Candidate',
    desc:`Reject <b class="font-extrabold text-white">${esc(c.anonymousId)}</b> from this position.`,
    body:`<div class="flex-1 space-y-5 overflow-y-auto p-6 thin-scroll">
      ${c.stage==='shortlisted'?`<div class="flex items-start gap-3 rounded-2xl border border-brand-warning/20 bg-brand-warning/10 p-4 text-[12.5px] leading-relaxed text-brand-warning">
        ${ic('dollarSign','mt-px h-[18px] w-[18px] shrink-0')}
        <p>The authorized payment for this candidate will be <b class="font-extrabold">automatically released</b> and you will not be charged.</p></div>`:''}
      <div>
        <label class="${LABEL} mb-1.5 block text-[13px] font-bold">Reason ${REQ_STAR}</label>
        <select id="rjCat" class="${SELECT}${catError?' border-brand-destructive':''}">
          <option value=""${cat?'':' selected'} disabled>Select a reason...</option>
          ${REJECTION_CATEGORIES.map(x=>`<option value="${esc(x)}"${cat===x?' selected':''}>${esc(x)}</option>`).join('')}
        </select>
        ${catError?`<p class="mt-1 text-xs text-brand-destructive">${catError}</p>`:''}
      </div>
      <div>
        <div class="mb-1.5 flex items-center gap-2">
          <label class="${LABEL} text-[13px] font-bold">Additional Notes ${REQ_STAR}</label>
          <span class="text-xs text-muted-foreground">(minimum ${MIN_NOTE_LENGTH} characters)</span>
        </div>
        <textarea id="rjNote" rows="3" maxlength="500" placeholder="Provide additional context..."
          class="${TEXTAREA}${noteError?' border-brand-destructive':''}">${esc(note)}</textarea>
        <div class="mt-1 flex items-center justify-between">
          ${noteError?`<p class="text-xs text-brand-destructive">${noteError}</p>`:'<span></span>'}
          <p class="text-xs text-muted-foreground">${note.length}/500</p>
        </div>
      </div></div>`,
    footer:`<button data-dlgcancel class="${btn('outline','default')}">Cancel</button>
      <button data-go ${valid?'':'disabled'} class="${btn('default','default',CTA_DESTRUCTIVE)}">Reject Candidate</button>`,
  }),wire(){
    $('rjCat').onchange=()=>reDlg({cat:$('rjCat').value,touched:Object.assign({},touched,{cat:true})});
    $('rjNote').oninput=()=>{reDlg({note:$('rjNote').value});keepCaret('rjNote');};

      if(!valid)return reDlg({touched:{cat:true,note:true}});
      moveStage(c,'rejected',{rejectionReason:`${cat} — ${trimmed}`,canReinstate:true});
      closeDlg();
      toast('Candidate rejected',`${c.anonymousId} has been rejected`);
    };
  }};
}

/* ============================================================================
   ReinstateDialog.tsx — "Move Back to Stage". No money moves either way; the
   referral fee is still charged only at Move to Hired.
   ============================================================================ */
/* Invite Sent clears the booking token, so a Resend is always required after —
   that stage stacks a confirmation. Interview Scheduled keeps its meeting. */
const FOLLOW_UP_BY_STAGE={interview_invite_sent:{action:'Resend',icon:'send',
  body:'Open their card in Interview Invite Sent and click Resend to send a fresh invite — the new link replaces the old one automatically.'}};

/** Only stages this candidate has already been in, with dead ends disabled. */
function reinstateOptions(c){
  return c.historyStages.map(k=>{
    const label=(STAGES.find(s=>s.id===k)||{}).label||k;
    if(k==='interview_scheduled'&&c.interviewOutcome)
      return {stageKey:k,label,available:false,unavailableReason:'The interview outcome is already recorded, so this booking can no longer be reopened.'};
    return {stageKey:k,label,available:true};
  });
}

/** Connectors for a candidate that has not been hired yet (drawn from the
    seeded fixture generator so the same names persist through the hire). */
function hireConnectors(c){
  if(c._conns)return c._conns;
  const rnd=mulberry32(c.id.split('').reduce((a,ch)=>a+ch.charCodeAt(0),7)*131);
  const pick=a=>a[Math.floor(rnd()*a.length)];
  const n=rnd()<0.35?2:1;
  c._conns=Array.from({length:n},(_,k)=>{
    const first=pick(FIRST),last=pick(LAST);
    return {connectorUserId:`${c.id}-conn${k+1}`,name:`${first} ${last}`,role:k===0?'primary':'supporting',
      avatar:null,jobTitle:pick(CONN_TITLES),company:pick(COMPANIES),
      linkedinUrl:`https://www.linkedin.com/in/${first}-${last}`.toLowerCase(),
      email:`${first}.${last}`.toLowerCase()+'@example.com',
      classificationType:rnd()<0.5?'internal':'external',isActiveEmployee:true};
  });
  return c._conns;
}

/** Hiring creates the pending payout rows the Release dialog then acts on. */
function seedPayoutState(job,c,conns,drafts,hireDate){
  const share=c.referralType==='direct'?0.70:0.50;
  const per=Math.round(job.perCandidate*10*share/conns.length);
  const waitDays=30;
  return {
    probationEndsAt:new Date(new Date(hireDate+'T00:00:00Z').getTime()+(job.probation||0)*864e5).toISOString(),
    connectors:conns.map(x=>{
      const d=drafts.find(y=>y.connectorUserId===x.connectorUserId)||{};
      const waitEndsAt=new Date(new Date(hireDate+'T00:00:00Z').getTime()+waitDays*864e5).toISOString();
      return Object.assign({},x,{
        classificationType:d.classificationType,isActiveEmployee:d.isActiveEmployee,
        payout:{status:'pending',recipientAmount:String(per),connectorTopUp:'0',
          canReleaseNow:new Date(waitEndsAt)<=NOW,waitEndsAt:new Date(waitEndsAt)<=NOW?null:waitEndsAt,
          completedAt:null,updatedAt:NOW.toISOString(),cancellationReason:null,cancellationNotes:null},
      });
    }),
    candidatePayout:job.successFee?{status:'pending',recipientAmount:String(job.successFee),candidateTopUp:'0',
      canReleaseNow:(job.probation||0)===0,completedAt:null,updatedAt:NOW.toISOString(),
      cancellationReason:null,cancellationNotes:null}:null,
  };
}

/** Shared wiring for the Internal/External toggle + active-employee checkbox. */
function wireClassification(L,drafts,after){
  L.querySelectorAll('[data-seg]').forEach(el=>el.onclick=()=>{
    const d=drafts.find(x=>x.connectorUserId===el.dataset.seg);
    if(!d)return;
    d.classificationType=el.dataset.val;
    /* External clears the internal-only flag; Internal restores the default. */
    d.isActiveEmployee=el.dataset.val!=='external';
    after();
  });
  L.querySelectorAll('[data-active]').forEach(el=>el.onclick=e=>{
    e.preventDefault();
    const d=drafts.find(x=>x.connectorUserId===el.dataset.active);
    if(!d)return;
    d.isActiveEmployee=!d.isActiveEmployee;
    after();
  });
}

/* ============================================================================
   ReleasePayoutDialog.tsx — releases or cancels one scope's payouts.
   The connector payout and the candidate bonus move independently, and each
   button persists after release as a read-only details view.
   ============================================================================ */
const MAX_NOTES=500, MIN_NOTES=3;
/* "Editable" = the recruiter can still act: a never-released row ('pending')
   or a recoverable failure they can retry ('failed'). 'manual_review' is not. */
const isEditablePayout=s=>s==='pending'||s==='failed';

const SCOPE_CONFIG={
  connector:{title:'Release Connector Payout',description:'Release or cancel the connector payout(s) for',
    detailsTitle:'Connector Payout Details',detailsDescription:'Connector payout status for',
    releaseLabel:'Release Connector Payout',cancelLabel:'Cancel Connector Payout',
    retainedPrompt:'Release the connector payout for the delivered hire.',reasons:CONNECTOR_CANCEL_REASONS},
  candidate:{title:'Release Candidate Bonus',description:'Release or cancel the candidate retention bonus for',
    detailsTitle:'Candidate Bonus Details',detailsDescription:'Candidate bonus status for',
    releaseLabel:'Release Candidate Bonus',cancelLabel:'Cancel Candidate Bonus',
    retainedPrompt:'Candidate was retained through probation. Release the candidate bonus.',reasons:CANDIDATE_CANCEL_REASONS},
};

const formatList=items=>items.length===0?'':items.length===1?items[0]
  :items.length===2?`${items[0]} and ${items[1]}`
  :`${items.slice(0,-1).join(', ')}, and ${items[items.length-1]}`;

/* Spells out which rows this cancellation touches and which are already gone. */
function notRetainedWarning(scope,pending,handled,candidatePayout){
  const cancelLines=[];
  if(scope==='connector')pending.forEach(x=>{if(x.payout)cancelLines.push(`${x.name}'s pending payout ($${commas(Number(x.payout.recipientAmount))})`);});
  else if(candidatePayout&&isEditablePayout(candidatePayout.status))
    cancelLines.push(`the candidate bonus ($${commas(Number(candidatePayout.recipientAmount))})`);
  const alreadyPaid=scope==='connector'?handled.filter(x=>x.payout&&x.payout.status==='completed'):[];
  return `<div class="space-y-2 rounded-2xl border border-brand-warning/20 bg-brand-warning/10 p-4 text-xs text-brand-warning">
    ${cancelLines.length?`<p><strong>Will be cancelled:</strong> ${esc(formatList(cancelLines))}.</p>`:''}
    ${alreadyPaid.length?`<p><strong>Already transferred:</strong> ${esc(formatList(alreadyPaid.map(x=>`${x.name}'s $${commas(Number(x.payout.recipientAmount||0))}`)))} — these will <strong>not</strong> be reversed (no refunds in this phase).</p>`:''}
    ${!cancelLines.length&&!alreadyPaid.length?'<p>Cancels any remaining pending payouts for this candidate.</p>':''}</div>`;
}

/* Connector payouts unblock per-type (hire + wait days), the candidate bonus on
   probation. Scoped so the dialog only reports its own blocked date. */
function releaseBlockerMessage(state,scope,drafts){
  if(scope==='connector'){
    const blocked=state.connectors.filter(x=>x.payout&&x.payout.status==='pending'&&!x.payout.canReleaseNow);
    if(!blocked.length)return null;
    const next=blocked.map(x=>x.payout.waitEndsAt).filter(Boolean).sort()[0];
    return next?`Connector payout available on ${fmtDate(next)}`:'Waiting period has not elapsed';
  }
  const p=state.candidatePayout;
  if(!p||p.status!=='pending'||p.canReleaseNow)return null;
  return state.probationEndsAt?`Release available on ${fmtDate(state.probationEndsAt)}`:'Probation period has not elapsed';
}

/* Commits the "release" mutation for one scope. Shared by the classic release
   dialog and the stepped pay-then-release flow below. */
function commitReleaseMutation(state,isConn,drafts){
  if(isConn)state.connectors.forEach(x=>{
    if(x.payout&&isEditablePayout(x.payout.status)&&x.payout.canReleaseNow){
      const d=drafts.find(y=>y.connectorUserId===x.connectorUserId);
      if(d){x.classificationType=d.classificationType;x.isActiveEmployee=d.isActiveEmployee;}
      /* An inactive internal employee is skipped rather than paid. */
      if(d&&d.classificationType==='internal'&&!d.isActiveEmployee){
        Object.assign(x.payout,{status:'cancelled',cancellationReason:'inactive_employee',
          cancellationNotes:null,updatedAt:NOW.toISOString()});
      }else{
        Object.assign(x.payout,{status:'completed',completedAt:NOW.toISOString(),
          updatedAt:NOW.toISOString(),connectorTopUp:'0'});
      }
    }
  });
  else if(state.candidatePayout&&state.candidatePayout.canReleaseNow)
    Object.assign(state.candidatePayout,{status:'completed',completedAt:NOW.toISOString(),
      updatedAt:NOW.toISOString(),candidateTopUp:'0'});
}

/* ============================================================================
   PayThenReleaseFlow.tsx — stepped replacement for the old stacked
   "Additional charge to release" popup.

   Shown when the fee was raised after the hire (pending amount > 0). One
   dialog, two explicit steps a non-technical user can follow:
     Step 1 — Pay the pending amount (card is charged; simulated here).
     Step 2 — Release the payout (unlocks only after the payment succeeds).

   Final presentation: slim progress bar + one focused card, with a single
   primary button that morphs from "Pay" into "Release".
   ============================================================================ */
function dlgReleaseStepped(c,ctx){
  const {cfg,isConn,state,pending,drafts,topUp,releaseTotal}=ctx;
  MODAL.drafts=drafts;
  const who=isConn?'connector':'candidate';
  const feeName=isConn?'referral fee':'success fee';
  const paid=!!MODAL.paid, charging=!!MODAL.charging, releasing=!!MODAL.releasing;
  const wstep=paid?(MODAL.wstep||2):1;
  const busy=charging||releasing;

  const spinner=t=>`<span class="inline-flex items-center gap-2">${ic('loader2','h-4 w-4 animate-spin')}${t}</span>`;
  const stepBadge=(n,st)=>st==='done'
    ?`<span class="grid h-7 w-7 shrink-0 place-items-center rounded-full bg-brand-success text-white">${ic('check','h-4 w-4')}</span>`
    :st==='active'
    ?`<span class="grid h-7 w-7 shrink-0 place-items-center rounded-full bg-brand-gradient text-[13px] font-extrabold text-white">${n}</span>`
    :`<span class="grid h-7 w-7 shrink-0 place-items-center rounded-full border border-border bg-muted text-[13px] font-bold text-muted-foreground">${n}</span>`;

  const payExplain=`<p class="text-[12.5px] leading-relaxed text-muted-foreground">The ${feeName} was increased after this hire, so a pending amount of <b class="font-bold text-foreground">$${commas(topUp)}</b> is due from your side. This amount must be paid before the ${who} payout can be released.</p>`;
  const amountBox=(label,amt,tone)=>`<div class="flex items-center justify-between rounded-xl border ${tone==='warn'?'border-brand-warning/30 bg-brand-warning/10':'border-border bg-muted/30'} px-4 py-3">
    <span class="text-[12.5px] font-semibold text-foreground">${label}</span>
    <span class="text-[17px] font-extrabold tabular-nums ${tone==='warn'?'text-brand-warning':'text-foreground'}">$${commas(amt)}</span></div>`;
  const paidBanner=`<div class="flex items-start gap-2.5 rounded-xl border border-brand-success/25 bg-brand-success/10 p-3.5 text-[12.5px] text-brand-success">
    ${ic('checkCircle2','mt-0.5 h-4 w-4 shrink-0')}<span><b class="font-extrabold">Payment successful.</b> $${commas(topUp)} was charged to Visa •••• 4242. You can now release the payout.</span></div>`;
  const failNote=`<p class="text-[11.5px] leading-relaxed text-muted-foreground">After the payment succeeds, you&rsquo;ll move to <b class="font-bold text-foreground">Step 2</b> to release the $${commas(releaseTotal)} payout. If the payment fails, nothing is released and you can try again.</p>`;
  const cancelLink=!paid&&!busy?`<button data-cancelmode class="text-[11.5px] font-semibold text-muted-foreground underline hover:text-brand-destructive">Need to cancel this payout instead?</button>`:'';

  const payBtn=cls=>charging
    ?`<button disabled class="${btn('default','default',CTA_BRAND)} ${cls||''}">${spinner('Processing payment…')}</button>`
    :paid
    ?`<button disabled class="${btn('default','default','bg-brand-success text-white')} ${cls||''}">${ic('check','mr-1.5 h-4 w-4')} Paid $${commas(topUp)}</button>`
    :`<button data-paynow class="${btn('default','default',CTA_BRAND)} ${cls||''}">${ic('creditCard','mr-1.5 h-4 w-4')} Pay $${commas(topUp)} &amp; Continue ${ic('arrowRight','ml-1.5 h-4 w-4')}</button>`;
  const relBtn=cls=>releasing
    ?`<button disabled class="${btn('default','default',CTA_BRAND)} ${cls||''}">${spinner('Releasing payout…')}</button>`
    :`<button data-releasego ${paid?'':'disabled'} class="${btn('default','default',paid?CTA_BRAND:'bg-muted text-muted-foreground')} ${cls||''}">${ic('wallet','mr-1.5 h-4 w-4')} Release $${commas(releaseTotal)} to ${who}</button>`;

  const classify=isConn&&pending.length?`<div class="space-y-2.5">
    <label class="${LABEL} text-[12.5px] font-bold">Confirm connector classification</label>
    ${pending.map(x=>classificationRow(x,drafts.find(d=>d.connectorUserId===x.connectorUserId),'Still an active employee')).join('')}</div>`:'';

  /* --- progress presentation ---------------------------------------------- */
  const pct=paid?(releasing?100:50):(charging?35:5);
  const progressHead=`<div class="space-y-1.5">
    <div class="flex items-center justify-between text-[11px] font-bold">
      <span class="uppercase tracking-wider text-muted-foreground">Step ${paid?'2':'1'} of 2 — ${paid?'Release payout':'Pay pending amount'}</span>
      <span class="tabular-nums text-brand-amethyst">${pct}%</span></div>
    <div class="h-1.5 w-full overflow-hidden rounded-full bg-muted"><div class="h-full rounded-full bg-brand-gradient transition-all duration-500" style="width:${pct}%"></div></div>
    <div class="flex justify-between text-[10px] font-semibold text-muted-foreground"><span class="${paid?'text-brand-success':''}">1 · Pay $${commas(topUp)}</span><span class="${paid?'text-brand-amethyst':''}">2 · Release $${commas(releaseTotal)}</span></div>
  </div>`;
  const progressBody=paid
    ?`${progressHead}${paidBanner}${classify}${amountBox(`Amount released to the ${who}`,releaseTotal)}`
    :`${progressHead}${payExplain}${amountBox('Pending amount to pay now',topUp,'warn')}${failNote}${cancelLink}`;
  const progressFooter=`<button data-dlgcancel class="${btn('outline','default')}">Cancel</button>${paid?relBtn():payBtn()}`;

  const bodyInner=progressBody;
  const footer=progressFooter;

  return {html:dlgShell({
    icon:'wallet', size:'sm:max-w-xl',
    title:cfg.title,
    desc:`Pay the pending amount first, then the payout is released for ${esc(c.anonymousId)}.`,
    body:`<div class="flex-1 space-y-4 overflow-y-auto p-6 thin-scroll">${bodyInner}</div>`,
    footer,
  }),wire(){
    const L=$('modalLayer'), self=MODAL;
    wireClassification(L,drafts,()=>reDlg({drafts}));
    const pay=L.querySelector('[data-paynow]');
    if(pay)pay.onclick=()=>{
      reDlg({charging:true});
      /* Simulates POST /payout/charge → webhook success. */
      setTimeout(()=>{if(MODAL!==self)return;reDlg({charging:false,paid:true,wstep:2});},1400);
    };
    const rel=L.querySelector('[data-releasego]');
    if(rel&&paid&&!releasing)rel.onclick=()=>{
      reDlg({releasing:true});
      setTimeout(()=>{if(MODAL!==self)return;
        commitReleaseMutation(state,isConn,drafts);
        applyPayoutFlags(c);closeDlg();renderPipeline();
        toast('Payout released',`Pending amount of $${commas(topUp)} paid and ${cfg.releaseLabel} completed for ${c.anonymousId}.`);
      },1200);
    };
    const cm=L.querySelector('[data-cancelmode]');
    if(cm)cm.onclick=()=>reDlg({retained:false});
  }};
}

function dlgRelease(c){
  const scope=MODAL.scope, cfg=SCOPE_CONFIG[scope], isConn=scope==='connector';
  const state=c.payoutState;
  if(!state)return {html:'',wire(){closeDlg();}};

  const pending=state.connectors.filter(x=>x.payout&&isEditablePayout(x.payout.status));
  const handled=state.connectors.filter(x=>!x.payout||!isEditablePayout(x.payout.status));
  const retained=MODAL.retained!==false;
  const reason=MODAL.reason||'', notes=MODAL.notes||'', showErrs=MODAL.showErrs;
  const drafts=MODAL.drafts||pending.map(x=>({connectorUserId:x.connectorUserId,
    classificationType:x.classificationType==='internal'?'internal':'external',
    isActiveEmployee:x.isActiveEmployee!==false}));

  const trimmed=notes.trim();
  const reasonError=retained?null:(!reason?'Please pick a reason.':null);
  const notesError=retained?null:(trimmed.length===0?'Please add a short note.'
    :trimmed.length<MIN_NOTES?`Notes must be at least ${MIN_NOTES} characters.`
    :notes.length>MAX_NOTES?`Notes must be ${MAX_NOTES} characters or less.`:null);
  const cancelFormInvalid=!!reasonError||!!notesError;

  const hasAnyPending=isConn?pending.length>0:isEditablePayout(state.candidatePayout&&state.candidatePayout.status);
  const hasReleasableNow=isConn
    ?pending.some(x=>x.payout.canReleaseNow)
    :!!(state.candidatePayout&&isEditablePayout(state.candidatePayout.status)&&state.candidatePayout.canReleaseNow);
  /* Nothing left to action in this scope → read-only details view. */
  const isViewMode=!hasAnyPending;
  const blocker=releaseBlockerMessage(state,scope,drafts);

  /* >0 only when the fee was raised after the hire — releasing then charges the
     difference, which is confirmed on its own before anything moves. */
  const topUp=isConn
    ?state.connectors.reduce((s,x)=>x.payout&&x.payout.status==='pending'&&x.payout.canReleaseNow&&x.payout.connectorTopUp?s+Number(x.payout.connectorTopUp):s,0)
    :(state.candidatePayout&&state.candidatePayout.canReleaseNow&&state.candidatePayout.candidateTopUp?Number(state.candidatePayout.candidateTopUp):0);
  const releaseTotal=isConn
    ?state.connectors.reduce((s,x)=>x.payout&&isEditablePayout(x.payout.status)&&x.payout.canReleaseNow?s+Number(x.payout.recipientAmount||0):s,0)
    :(state.candidatePayout?Number(state.candidatePayout.recipientAmount||0):0);

  /* Fee was raised after the hire → hand off to the pay-then-release stepped
     flow instead of stacking a second confirmation popup on this dialog. */
  if(retained&&topUp>0&&hasReleasableNow&&!isViewMode)
    return dlgReleaseStepped(c,{scope,cfg,isConn,state,pending,drafts,topUp,releaseTotal});

  const ctaLabel=retained
    ?(isConn?(releaseTotal>0?`${cfg.releaseLabel} · $${commas(releaseTotal)}`:cfg.releaseLabel)
            :(state.candidatePayout?`${cfg.releaseLabel} · $${commas(Number(state.candidatePayout.recipientAmount))}`:cfg.releaseLabel))
    :cfg.cancelLabel;
  const ctaDisabled=!hasAnyPending||(retained&&!hasReleasableNow)||(!retained&&cancelFormInvalid&&showErrs);

  const cancelForm=`<div class="space-y-3">
    <div class="space-y-1.5">
      <label class="${LABEL} font-bold" for="rlReason">Cancellation reason<span class="ml-0.5 text-brand-destructive">*</span></label>
      <select id="rlReason" class="${SELECT} rounded-xl${showErrs&&reasonError?' border-brand-destructive':''}">
        <option value=""${reason?'':' selected'} disabled>Select a reason…</option>
        ${cfg.reasons.map(([v,l])=>`<option value="${v}"${reason===v?' selected':''}>${esc(l)}</option>`).join('')}
      </select>
      ${showErrs&&reasonError?`<p class="text-xs text-brand-destructive">${reasonError}</p>`:''}
    </div>
    <div class="space-y-1.5">
      <label class="${LABEL} font-bold" for="rlNotes">Additional notes<span class="ml-0.5 text-brand-destructive">*</span></label>
      <textarea id="rlNotes" rows="3" maxlength="${MAX_NOTES}" placeholder="Briefly explain the cancellation. The connector will see this."
        class="${TEXTAREA} rounded-xl${showErrs&&notesError?' border-brand-destructive':''}">${esc(notes)}</textarea>
      <div class="flex items-center justify-between">
        ${showErrs&&notesError?`<p class="text-xs text-brand-destructive">${notesError}</p>`:'<span></span>'}
        <span class="text-xs ${notes.length>MAX_NOTES?'text-brand-destructive':'text-muted-foreground'}">${notes.length}/${MAX_NOTES}</span>
      </div>
    </div>
  </div>
  ${notRetainedWarning(scope,pending,handled,state.candidatePayout)}`;

  const body=`<div class="flex-1 space-y-4 overflow-y-auto p-6 thin-scroll">
    <div class="space-y-4">
      ${hasAnyPending?`<label data-retained class="flex cursor-pointer items-start gap-2.5 rounded-2xl border border-border bg-muted/30 p-4 text-sm">
        ${CHK(retained)}<span class="font-medium text-foreground">${cfg.retainedPrompt}</span></label>`:''}
      ${!retained&&hasAnyPending?cancelForm:''}
      ${isConn&&retained&&pending.length?`<div class="space-y-3">
        <label class="${LABEL} text-sm font-bold">Confirm connector classification</label>
        ${pending.map(x=>classificationRow(x,drafts.find(d=>d.connectorUserId===x.connectorUserId),'Still an active employee')).join('')}
      </div>`:''}
      ${isConn&&handled.length?`<div class="space-y-3">
        <label class="${LABEL} text-[10px] uppercase tracking-wider text-muted-foreground">Already processed</label>
        <div class="space-y-3">${handled.map(x=>`<div class="rounded-2xl border border-border bg-muted/30 p-4">
          <div class="flex items-start justify-between gap-3">
            ${connectorIdentity(withoutEmail(x))}
            ${x.payout?`<div class="shrink-0">${payoutStatusPill(x.payout)}</div>`:''}
          </div>
          ${x.payout?payoutRowDetail(x.payout):''}</div>`).join('')}</div>
      </div>`:''}
      ${!isConn&&state.candidatePayout?`<div class="border-t border-border pt-3 text-sm">
        <div class="flex items-center justify-between">
          <span class="font-medium text-foreground">Candidate bonus
            <span class="ml-1.5 text-xs text-muted-foreground">$${commas(Number(state.candidatePayout.recipientAmount))}</span></span>
          ${isEditablePayout(state.candidatePayout.status)
            ?`<span class="text-xs font-medium text-brand-warning">${state.candidatePayout.status==='failed'?'Will be retried':'Will be released'}</span>`
            :payoutStatusPill(state.candidatePayout)}
        </div>
        ${payoutRowDetail(state.candidatePayout)}
      </div>`:''}
      ${blocker&&retained?`<div class="rounded-xl border border-border bg-muted/40 p-2.5 text-xs text-muted-foreground">${esc(blocker)}</div>`:''}
    </div>
    ${retained&&topUp>0?`<div class="flex items-start gap-2.5 rounded-2xl border border-brand-warning/20 bg-brand-warning/10 p-4 text-xs text-brand-warning">
      ${ic('alertCircle','mt-0.5 h-4 w-4 shrink-0')}
      <p>The ${isConn?'referral fee':'success fee'} was increased after this hire. Releasing now will charge your card an additional <strong>$${commas(topUp)}</strong> so the ${isConn?'connector':'candidate'} is paid at the updated fee.</p></div>`:''}
  </div>`;

  const doRelease=()=>{
    if(retained){
      commitReleaseMutation(state,isConn,drafts);
    }else{
      const patch={status:'cancelled',cancellationReason:reason,cancellationNotes:trimmed,updatedAt:NOW.toISOString()};
      if(isConn)state.connectors.forEach(x=>{if(x.payout&&isEditablePayout(x.payout.status))Object.assign(x.payout,patch);});
      else if(state.candidatePayout&&isEditablePayout(state.candidatePayout.status))Object.assign(state.candidatePayout,patch);
    }
    applyPayoutFlags(c);
    closeDlg();
    renderPipeline();
    toast(retained?'Payouts released':'Payouts cancelled',
      retained?`${cfg.releaseLabel} completed for ${c.anonymousId}.`:`${cfg.cancelLabel} recorded for ${c.anonymousId}.`);
  };

  return {html:dlgShell({
    icon:'wallet', size:'sm:max-w-xl',
    title:isViewMode?cfg.detailsTitle:cfg.title,
    desc:`${isViewMode?cfg.detailsDescription:cfg.description} ${esc(c.anonymousId)}.`,
    body,
    footer:`<button data-dlgcancel class="${btn('outline','default')}">${isViewMode?'Close':'Cancel'}</button>
      ${isViewMode?'':`<button data-go ${ctaDisabled?'disabled':''} class="${btn('default','default',retained?CTA_BRAND:CTA_DESTRUCTIVE)}">${esc(ctaLabel)}</button>`}`,
  }),wire(){
    const L=$('modalLayer');
    const keep={drafts,retained,reason,notes,showErrs};
    if(L.querySelector('[data-retained]'))L.querySelector('[data-retained]').onclick=e=>{
      e.preventDefault();reDlg(Object.assign({},keep,{retained:!retained}));};
    if($('rlReason'))$('rlReason').onchange=()=>reDlg(Object.assign({},keep,{reason:$('rlReason').value}));
    if($('rlNotes'))$('rlNotes').oninput=()=>{reDlg(Object.assign({},keep,{notes:$('rlNotes').value}));keepCaret('rlNotes');};
    wireClassification(L,drafts,()=>reDlg(keep));
    if(L.querySelector('[data-go]'))L.querySelector('[data-go]').onclick=()=>{
      if(cancelFormInvalid)return reDlg(Object.assign({},keep,{showErrs:true}));
      doRelease();
    };
  }};
}

/* CandidatePipelineTracker.tsx + candidate-pipeline-tracker.utils.ts */
const STEP_ICONS={not_qualified:'ban',in_review:'eye',shortlisted:'thumbsUp',interview_scheduled:'calendar',
  interview_completed:'checkCircle2',interview_invite_sent:'send',qualified:'sparkles',hired:'trophy',rejected:'xCircle'};
function stepColor(status,step){
  if(status==='current'&&step==='hired')return {bg:'bg-emerald-500',ring:'ring-emerald-500/30 ring-4',text:'text-white'};
  if(status==='current'&&step==='rejected')return {bg:'bg-slate-500',ring:'ring-slate-400/30 ring-4',text:'text-white'};
  if(status==='completed')return {bg:'bg-brand-success',ring:'ring-brand-success/20',text:'text-white'};
  if(status==='current')return {bg:'bg-brand-amethyst',ring:'ring-brand-amethyst/30 ring-4 animate-pulse',text:'text-white'};
  if(status==='skipped')return {bg:'bg-muted/50',ring:'',text:'text-muted-foreground/50'};
  return {bg:'bg-muted',ring:'',text:'text-muted-foreground'};
}
const currentBadgeClass=step=>step==='hired'?'bg-emerald-500/15 text-emerald-700'
  :step==='rejected'?'bg-slate-500/15 text-slate-600':'bg-brand-amethyst/15 text-brand-amethyst';

function pipelineTracker(steps,currentStage){
  const done=steps.filter(s=>s.status==='completed').length;
  const pct=steps.length?Math.round(done/steps.length*100):0;
  const currentLabel=(steps.find(s=>s.step===currentStage)||{}).label||'';
  return `<div class="${CARD} border-brand-amethyst/20 bg-gradient-to-br from-brand-amethyst/5 to-brand-rose/5">
    <div class="space-y-4 p-4">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="flex h-8 w-8 items-center justify-center rounded-full bg-brand-amethyst/15">${ic('layers','h-4 w-4 text-brand-amethyst')}</div>
          <div>
            <h4 class="text-sm font-semibold">Candidate Pipeline</h4>
            <p class="text-xs text-muted-foreground">${done} of ${steps.length} completed</p>
          </div>
        </div>
        <span class="${BADGE} border-brand-amethyst/30 bg-brand-amethyst/15 text-brand-amethyst">${pct}%</span>
      </div>
      <div class="pb-1"><div class="relative">
        <div class="absolute left-0 right-0 top-4 h-0.5 min-w-full bg-border"></div>
        <div class="overflow-x-auto thin-scroll md:overflow-visible">
          <div class="relative flex min-w-max items-start gap-3 md:min-w-0">
            ${steps.map(s=>{const col=stepColor(s.status,s.step);
              return `<div class="flex min-w-[100px] flex-shrink-0 flex-col items-center md:min-w-0 md:flex-1">
                <div class="relative px-2"><div class="flex h-8 w-8 items-center justify-center rounded-full transition-all ${col.bg} ${col.ring}">
                  ${ic(s.status==='completed'?'check':(STEP_ICONS[s.step]||'circle'),'h-4 w-4 '+col.text)}</div></div>
                <div class="mt-2 max-w-full text-center"><div class="flex flex-col items-center gap-1">
                  <span class="break-words text-xs font-medium leading-tight ${s.status==='pending'?'text-muted-foreground':(s.status==='skipped'?'text-muted-foreground/50 line-through':'text-foreground')}">${esc(s.label)}</span>
                  ${s.status==='current'?`<span class="${BADGE} hidden border-0 px-1 py-0 text-[9px] md:inline-flex ${currentBadgeClass(s.step)}">Current</span>`:''}
                </div></div>
                ${(s.status==='completed'||s.status==='current')&&s.completedAt?`<p class="mt-0.5 text-center text-[10px] leading-tight text-muted-foreground">${fmtDateTime(s.completedAt)}</p>`:''}
              </div>`;}).join('')}
          </div>
        </div>
      </div></div>
      ${currentLabel?`<div class="flex justify-center md:hidden">
        <span class="${BADGE} border-0 px-2 py-1 text-[10px] ${currentBadgeClass(currentStage)}">Current Stage: ${esc(currentLabel)}</span></div>`:''}
    </div></div>`;
}
