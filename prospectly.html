/* CandidateGapAnalysisSummary.tsx — the "Candidate Evaluation" block */
const chipStatusClass=s=>s==='ok'?'border-brand-success/30 bg-brand-success/10 text-brand-success'
  :s==='partial'?'border-brand-warning/30 bg-brand-warning/10 text-brand-warning'
  :'border-brand-destructive/30 bg-brand-destructive/10 text-brand-destructive';
const scoreStatus=p=>p>=80?'ok':(p>=50?'partial':'gap');

function gapAnalysis(g){
  if(!g)return '';
  const matched=g.dimensions.flatMap(d=>d.matched.map(x=>x.label));
  const gaps=g.dimensions.flatMap(d=>d.gaps.map(x=>x.label));
  const chips=(labels,status)=>`<div class="flex flex-wrap items-center gap-1.5">${labels.map(l=>
    `<span class="rounded-full border px-2.5 py-1 text-xs font-medium ${chipStatusClass(status)}">${esc(l)}</span>`).join('')}</div>`;
  const head=(icon,tone,label,n,pill)=>`<div class="mb-1.5 flex items-center gap-1">
    ${ic(icon,'h-3.5 w-3.5 '+tone)}<span class="text-xs font-medium text-muted-foreground">${label}</span>
    <span class="rounded-full ${pill} px-1.5 py-0.5 text-[10px] font-semibold">${n}</span></div>`;
  return `<div class="mt-4 border-t pt-4">
    <div class="mb-3 flex items-center gap-2">
      ${ic('target','h-4 w-4 text-muted-foreground')}
      <h4 class="text-sm font-medium text-foreground">Candidate Evaluation</h4>
      <span class="${BADGE} ml-auto border text-xs font-medium ${chipStatusClass(scoreStatus(g.matchScore))}">${ic('target','mr-1 h-3 w-3')}${Math.round(g.matchScore)}% Match</span>
    </div>
    ${matched.length?`<div class="mb-2.5">${head('trendingUp','text-brand-success','Matched',matched.length,'bg-brand-success/10 text-brand-success')}${chips(matched,'ok')}</div>`:''}
    ${gaps.length?`<div class="mb-3">${head('trendingDown','text-brand-destructive','Gaps',gaps.length,'bg-brand-destructive/10 text-brand-destructive')}${chips(gaps,'gap')}</div>`:''}
    <button data-detailgap="1" class="inline-flex items-center gap-1 text-sm font-medium text-brand-amethyst hover:underline">View full analysis</button>
  </div>`;
}

/* CandidateAssessmentAnswers.tsx */
function assessmentAnswers(rs){
  if(!rs.length)return '<p class="text-sm text-muted-foreground">This candidate has no assessment answers.</p>';
  const badge=isCorrect=>isCorrect===true
    ?`<span class="${BADGE} shrink-0 gap-1 border-emerald-200 bg-emerald-50 text-emerald-700">${ic('checkCircle2','h-3.5 w-3.5')} Correct</span>`
    :isCorrect===false?`<span class="${BADGE} shrink-0 gap-1 border-red-200 bg-red-50 text-red-700">${ic('xCircle','h-3.5 w-3.5')} Incorrect</span>`
    :`<span class="${BADGE} shrink-0 gap-1 border-slate-200 bg-slate-50 text-slate-600">${ic('minusCircle','h-3.5 w-3.5')} Answered</span>`;
  return `<div class="space-y-3">${rs.map((r,i)=>{
    const answer=r.questionType==='text'?(r.answer.text||'—'):((r.answer.selectedLabels||[]).join(', ')||'—');
    const correct=r.correctAnswer?(r.options.filter(o=>r.correctAnswer.optionIds.includes(o.id)).map(o=>o.label).join(', ')):null;
    return `<div class="${CARD} p-4">
      <div class="flex items-start justify-between gap-3">

        ${r.questionType!=='text'?badge(r.isCorrect):''}
      </div>
      <div class="mt-3 rounded-lg bg-muted/40 px-3 py-2">
        <p class="text-[10px] font-semibold uppercase tracking-wider text-muted-foreground">Candidate's answer</p>
        <p class="mt-0.5 text-sm">${esc(answer)}</p>
      </div>
      ${r.isCorrect===false&&correct?`<p class="mt-2 text-xs text-muted-foreground">Expected answer: <span class="font-medium text-emerald-600">${esc(correct)}</span></p>`:''}
    </div>`;}).join('')}</div>`;
}

/* apply-board-stage-to-detail.ts — align the modal with the connector column
   the card was opened from. These stages carry no recruiter pipeline. */
const BOARD_STAGE_NO_PIPELINE=['not_qualified','connector_declined','rejected','ai_analysis'];
function applyBoardStage(detail,boardStage,stageLabel){
  if(!boardStage)return detail;
  const label=stageLabel||(CONNECTOR_COLS.find(x=>x.id===boardStage)||{}).label||detail.stageLabel;
  if(BOARD_STAGE_NO_PIPELINE.includes(boardStage))
    return Object.assign({},detail,{stage:boardStage,stageLabel:label,pipelineSteps:[]});
  if(boardStage==='consent_declined')
    return Object.assign({},detail,{stage:boardStage,stageLabel:label});
  return detail;
}

function dlgDetail(c){
  const d=applyBoardStage(c.detail,MODAL.boardStage,MODAL.stageLabel);
  const hidden=HIDDEN_DETAIL_STAGES.includes(d.stage)&&!d.detailsRevealed;
  const meta=d.resumeMetadata;
  const tabs=[];

/* ============================================================================
   MODAL DISPATCH — one layer, one re-render per state change (renderCollab's
   convention), so a dialog's fields and the board never drift apart.
   ============================================================================ */
const DIALOGS={shortlist:dlgShortlist,reject:dlgReject,reinstate:dlgReinstate,outcome:dlgOutcome,
  hire:dlgHire,payout:dlgRelease,editclass:dlgEditClass,interview:dlgInterview,
  calendar:dlgCalendar,emails:dlgEmails,detail:dlgDetail};
const STANDALONE_DIALOGS={signout:dlgSignout,deleteaccount:dlgDeleteAccount,gapfull:dlgGapAnalysis};

function renderModal(){
  const L=$('modalLayer');
  if(!MODAL&&!filterOpen){L.innerHTML='';return;}
  let html='',wire=null;
  if(MODAL){
    /* Shell-level dialogs (sign out) belong to no candidate. */
    const standalone=STANDALONE_DIALOGS[MODAL.type];
    if(standalone){
      const out=standalone();
      html=out.html;wire=out.wire;
    }else{
      const c=findCand(MODAL.cid);
      const build=DIALOGS[MODAL.type];
      if(!c||!build){closeDlg();return;}
      const out=build(c);
      html=out.html;wire=out.wire;
    }
  }
  L.innerHTML=html+filterSheet();

  /* Shared chrome: scrim + the hero close button + the footer Cancel. */
  L.querySelectorAll('[data-dlgclose],[data-dlgcancel]').forEach(el=>el.onclick=closeDlg);
  const scrim=L.querySelector('[data-dlgscrim]');
  /* A stacked AlertDialog owns the interaction while it is up. */
  if(scrim)scrim.onclick=()=>{if(!L.querySelector('[data-alertscrim]'))closeDlg();};
  if(wire)wire();
  wireFilterSheet(L);
}

function wireFilterSheet(L){
  if(!filterOpen)return;
  const close=()=>{filterOpen=false;renderPipeline();};
  L.querySelector('[data-filterscrim]').onclick=close;
  L.querySelector('[data-filterclose]').onclick=close;
  L.querySelector('[data-filterdone]').onclick=close;
  L.querySelector('[data-filterclear]').onclick=()=>{matchRanges=[];stageFilter=[];renderPipeline();};
  L.querySelector('[data-mrall]').onclick=e=>{e.preventDefault();matchRanges=[];renderPipeline();};
  L.querySelectorAll('[data-mr]').forEach(el=>el.onclick=e=>{
    e.preventDefault();const v=el.dataset.mr;
    matchRanges=matchRanges.includes(v)?matchRanges.filter(x=>x!==v):matchRanges.concat(v);
    renderPipeline();});
  L.querySelector('[data-stall]').onclick=e=>{e.preventDefault();stageFilter=[];renderPipeline();};
  L.querySelectorAll('[data-st]').forEach(el=>el.onclick=e=>{
    e.preventDefault();const v=el.dataset.st;
    stageFilter=stageFilter.includes(v)?stageFilter.filter(x=>x!==v):stageFilter.concat(v);
    renderPipeline();});
}

  j1:['Python','LLM Architecture','Vector Search','MLOps','AWS','Kubernetes','LangChain'],

  j3:['Figma','Design Systems','Prototyping','User Research'],

};

const POOL_JOBS=JOBS.filter(j=>j.status==='active').map((j,i)=>({
  jobId:j.id, jobTitle:j.title, jobCompany:j.company, jobLocation:j.location, jobDescription:j.desc,
  jobRequiredSkills:REFER_SKILLS[j.id]||[], jobPreferredSkills:REFER_PREFERRED[j.id]||[],
  salMin:j.salMin, salMax:j.salMax, period:j.period, posted:j.posted,
  myReferCount:[3,0,1,2][i%4], candidateCount:countFor(j.id), hasSharedLink:i%2===0,
}));
const REFER_CAND_STATES=[
  {status:'consent_accepted'},
  {status:'consent_pending'},
  {status:'consent_declined',reason:'salary',notes:'Looking for at least 15% above the posted band.'},
  {status:'connector_declined'},
  {status:'approved'},
  {status:'consent_superseded'},
];
const CLOSED_POOL_JOBS=JOBS.filter(j=>j.status!=='active').map(j=>({
  jobId:j.id, jobTitle:j.title, jobCompany:j.company, jobLocation:j.location, jobDescription:j.desc,
  jobRequiredSkills:REFER_SKILLS[j.id]||[], jobPreferredSkills:REFER_PREFERRED[j.id]||[],
  salMin:j.salMin, salMax:j.salMax, period:j.period, posted:j.posted,
  closedAt:j.closedAt, closedReason:j.closedReason,
  /* A connector sees the people they referred by name, so the anonymised
     pipeline record is paired with a seeded name from the same fixture pools. */
  candidates:CANDIDATES[j.id].slice(0,4).map((c,k)=>{
    /* Offset per job so all six connector states show up across the closed list. */
    const st=REFER_CAND_STATES[(JOBS.indexOf(j)*4+k)%REFER_CAND_STATES.length];
    const seed=(JOBS.indexOf(j)*7+k*11);
    const name=c.revealedName||`${FIRST[seed%FIRST.length]} ${LAST[(seed*3)%LAST.length]}`;
    const skills=REFER_SKILLS[j.id]||[];
    return {
      matchId:c.id, candidateName:name, candidateTitle:c.currentTitle, candidateCompany:c.currentCompany,
      candidateEmail:c.revealedEmail||name.toLowerCase().replace(/\s+/g,'.')+'@example.com',
      matchScore:c.matchScore, status:st.status,
      consentDeclineReason:st.reason||null, consentDeclineNotes:st.notes||null,
      declinedAt:(st.status==='consent_declined'||st.status==='connector_declined')?isoPlus(-(6+k*3)):null,
      gap:{score:c.matchScore,
           matched:skills.slice(0,Math.max(2,4-(k%2))),
           gaps:(REFER_PREFERRED[j.id]||['Domain depth','Team leadership']).slice(0,2)},
    };
  }),
}));

const referState={tab:'inbox',q:''};

function renderRefer(){
  const q=referState.q.trim().toLowerCase();
  const matches=j=>!q||[j.jobTitle,j.jobCompany,j.jobLocation].join(' ').toLowerCase().includes(q);
  const inbox=POOL_JOBS.filter(matches), closed=CLOSED_POOL_JOBS.filter(matches);

  let body;
  if(referState.tab==='closed'){
    const totalClosedCands=closed.reduce((n,j)=>n+j.candidates.length,0);
    body=totalClosedCands===0
      ? (q?referNoResults(referState.q,'closed jobs')
          :referEmptyState('archive','No closed jobs yet',"When jobs you've referred candidates to are closed, they'll appear here for reference. Browse the marketplace to find more roles to refer."))

        </div>`;
  }

  $('view-refer').innerHTML=`
  <div class="flex h-full min-h-0 flex-col overflow-hidden">
    <div class="flex-shrink-0 px-4 sm:px-6 pt-4">

        listMinWidth:'min-w-[300px]',listMaxWidth:'max-w-md',
        tabs:[{value:'inbox',label:'Inbox',icon:'inbox',badge:POOL_JOBS.length||undefined},
              {value:'closed',label:'Closed',icon:'archive',badge:CLOSED_POOL_JOBS.length||undefined}]})}
    </div>
    <div class="flex-1 min-h-0 flex flex-col overflow-hidden">
      <div class="mx-2 sm:mx-3 md:mx-4 lg:mx-6 overflow-y-auto thin-scroll pb-6">${body}</div>
    </div>

  const v=$('view-refer');
  bindPipelineTabs(v,referState,renderRefer,'referSearch');
  v.querySelectorAll('[data-referupload]').forEach(el=>el.onclick=()=>toast('Refer a Candidate','The resume upload flow is outside the scope of this prototype.'));

  v.querySelectorAll('[data-refermenu]').forEach(el=>el.onclick=e=>{
    e.stopPropagation();openReferMenu(el.dataset.refermenu,el);});
  v.querySelectorAll('[data-gapfull]').forEach(el=>el.onclick=()=>{
    const g=GAP_REGISTRY[el.dataset.gapfull];
    if(g)openDlg('gapfull',{gap:g});

  connector_declined:{color:'bg-rose-500',headBorder:'border-rose-500',dotRing:'ring-rose-500/15',countBg:'bg-rose-100',countText:'text-rose-700'},
};
const CONNECTOR_EMAIL_STAGES=new Set(['consent_pending','consent_accepted','shortlisted',
  'interview_invite_sent','interview_scheduled','interview_completed','hired','rejected']);
const CONNECTOR_CARD_SHELL="rounded-xl border border-slate-200 bg-white p-[15px] shadow-none transition-all duration-200 hover:-translate-y-0.5 hover:border-[#D2D6E0] hover:shadow-[0_4px_14px_rgba(11,16,32,0.06)]";

/* Recruiter pipeline stages -> the connector's 13-column view. `in_review` fans
   out across the pre-referral and consent columns so every column has cards. */
const CONNECTOR_INREVIEW_FAN=['ai_analysis','qualified','consent_pending','consent_accepted',
  'consent_declined','connector_declined'];
function connectorStageFor(c,i){
  if(c.stage==='in_review')return CONNECTOR_INREVIEW_FAN[i%CONNECTOR_INREVIEW_FAN.length];
  return c.stage;
}
function connectorBoard(job){
  let n=0;
  return CANDIDATES[job.id].map((c,i)=>{
    const stage=connectorStageFor(c,c.stage==='in_review'?n++:i);
    const seed=(JOBS.indexOf(job)*13+i*7);
    const name=c.revealedName||`${FIRST[seed%FIRST.length]} ${LAST[(seed*5)%LAST.length]}`;
    return {
      id:c.id, candidateName:name, currentTitle:c.currentTitle, jobTitle:job.title,
      jobCompany:job.company, candidateEmail:c.revealedEmail||name.toLowerCase().replace(/\s+/g,'.')+'@example.com',
      matchScore:c.matchScore, stage, notQualifiedReason:c.notQualifiedReason,
      source:i%5===0?'direct_application':'referral',
      hasResume:i%3!==0, bountyAmount:job.perCandidate, isSplit:i%7===0,
      inviteSentAt:stage==='interview_invite_sent'?isoPlus(-3):null,
      interviewScheduledAt:stage==='interview_scheduled'?c.meetingDate||isoPlus(4):null,
      interviewCompletedAt:stage==='interview_completed'?c.meetingDate||isoPlus(-6):null,
      payoutCancelled:stage==='hired'&&i%6===0,
      payoutCancellationReason:'Candidate did not pass probation',
    };
  });
}

/* PipelineFilterSheet — stage chips only, the board has no other filter group */
function openBoardFilter(){
  const job=activeJob();
  const counts=connectorBoard(job).reduce((m,c)=>{m[c.stage]=(m[c.stage]||0)+1;return m;},{});
  const chips=CONNECTOR_COLS.map(col=>{
    const on=boardStageFilter.includes(col.id);
    return `<button data-bst="${col.id}" class="flex w-full items-center justify-between rounded-xl border px-3 py-2 text-left text-sm transition-all ${on?'border-brand-amethyst/40 bg-brand-amethyst/10':'border-border hover:bg-muted/60'}">
      <span class="flex items-center gap-2.5">${CHK(on)}<span class="h-[9px] w-[9px] rounded-full ${CONNECTOR_COLORS[col.id].color}"></span>
        <span class="font-medium">${col.label}</span></span>
      <span class="text-xs font-bold text-muted-foreground">${counts[col.id]||0}</span></button>`;
  }).join('');
  MODAL={type:'boardfilter'};
  $('modalLayer').innerHTML=alertShell({
    title:'<h2 class="text-lg font-semibold">Filter candidates</h2>',
    desc:'Show only the stages you want on the board.',
    body:`<div class="max-h-[50vh] space-y-1.5 overflow-y-auto thin-scroll pr-1">${chips}</div>`,
    footer:`<button data-bclear class="${btn('outline','default','mt-2 sm:mt-0')}">Clear all</button>
      <button data-dlgcancel class="${btn('default','default',PRIMARY_BTN)}">Done</button>`,
  });
  const L=$('modalLayer');
  L.querySelectorAll('[data-bst]').forEach(el=>el.onclick=()=>{
    const id=el.dataset.bst;
    boardStageFilter=boardStageFilter.includes(id)?boardStageFilter.filter(x=>x!==id):boardStageFilter.concat(id);
    renderReferJob();openBoardFilter();});
  const clr=L.querySelector('[data-bclear]');
  if(clr)clr.onclick=()=>{boardStageFilter=[];renderReferJob();openBoardFilter();};
  L.querySelectorAll('[data-dlgcancel]').forEach(el=>el.onclick=()=>{MODAL=null;$('modalLayer').innerHTML='';});
  const scrim=L.querySelector('[data-alertscrim]');
  if(scrim)scrim.onclick=()=>{MODAL=null;$('modalLayer').innerHTML='';};
}

function renderProfile(){
  const rail=PROFILE_SECTIONS.map(sec=>{
    const on=sec.id===profileSection;
    return `<button data-pfsec="${sec.id}" data-state="${on?'active':'inactive'}" class="${RAIL_TRIGGER}${on?' '+RAIL_ACTIVE:''}">
      ${ic(sec.i,'h-[18px] w-[18px] shrink-0')}<span class="whitespace-nowrap">${sec.label}</span></button>`;
  }).join('');
  $('view-profile').innerHTML=`
  <div class="min-w-0 w-full">
    <div class="mx-auto min-w-0 w-full max-w-[1440px] p-4 md:p-6">
      ${profileHeader()}
      <div class="grid min-w-0 grid-cols-1 items-start gap-4 lg:grid-cols-[300px_1fr]">
        <div class="min-w-0 lg:sticky lg:top-4 lg:self-start">

            ${rail}
          </div>
        </div>
        <div class="min-w-0 space-y-6">${PROFILE_PANELS[profileSection]()}</div>
      </div>
    </div>
  </div>`;

  const v=$('view-profile');
  v.querySelectorAll('[data-pfsec]').forEach(el=>el.onclick=()=>{profileSection=el.dataset.pfsec;renderProfile();$('main').scrollTop=0;});

   GAP ANALYSIS DIALOG — gap-analysis/GapAnalysisDialog.tsx + Rail + Accordion
   Opened by the "View full analysis" link on the evaluation summary.
   ============================================================================ */
const GAP_STATUS_LABEL={ok:'Strong Match',partial:'Partial Match',gap:'Limited Match'};
const badgeStatusClass=s=>s==='ok'?'bg-brand-success/10 text-brand-success'
  :s==='partial'?'bg-brand-warning/10 text-brand-warning':'bg-brand-destructive/10 text-brand-destructive';
const barFillClass=s=>s==='ok'?'bg-brand-success':s==='partial'?'bg-brand-warning':'bg-brand-destructive';
const GAP_VERDICT_ICON={ok:'checkCircle2',partial:'alertTriangle',gap:'xCircle'};
/* GapAnalysisScoreBreakdownPanel SHORT_LABELS + GapAnalysisAccordion DIMENSION_ICONS */
const GAP_DIMENSIONS=[
  {key:'skillsMatch',short:'Skills',icon:'wrench',title:'Skills match',weight:35},
  {key:'experienceMatch',short:'Experience',icon:'briefcase',title:'Experience match',weight:25},
  {key:'domainKnowledge',short:'Domain',icon:'building2',title:'Domain knowledge',weight:15},
  {key:'educationMatch',short:'Education',icon:'graduationCap',title:'Education match',weight:10},
  {key:'workEligibility',short:'Eligibility',icon:'mapPin',title:'Work eligibility',weight:10},
  {key:'employmentTypeCompatibility',short:'Employment type',icon:'briefcase',title:'Employment type compatibility',weight:5},
];
const GAP_REASONS={
  skillsMatch:'Some required tools were not evidenced in the resume.',
  experienceMatch:'Fewer years in a directly comparable role than the posting asks for.',
  domainKnowledge:'Limited exposure to this industry vertical.',
  educationMatch:'Degree field differs from the one listed as preferred.',
  workEligibility:'Location falls outside the listed countries.',
  employmentTypeCompatibility:'Availability differs from the posted employment type.',
};

/* Expands the summary payload into the six weighted dimensions the modal shows,
   with the points always adding back up to the score on the ring. */
function buildGapPayload(g,ctx){
  if(!g)return null;
  const score=Math.round(g.score);
  const matched=g.matched||[], gaps=g.gaps||[];
  /* Deterministic split: every dimension keeps the same ratio as the overall
     score, then the rounding remainder lands on the largest weight. */
  const raw=GAP_DIMENSIONS.map(d=>({d,exact:d.weight*score/100}));
  let earned=raw.map(r=>({key:r.d.key,weight:r.d.weight,pointsEarned:Math.floor(r.exact)}));
  let drift=score-earned.reduce((n,e)=>n+e.pointsEarned,0);
  for(let i=0;drift>0;i=(i+1)%earned.length){
    if(earned[i].pointsEarned<earned[i].weight){earned[i].pointsEarned++;drift--;}
  }
  earned.forEach(e=>{e.pointsLost=e.weight-e.pointsEarned;
    e.reason=e.pointsLost>0?GAP_REASONS[e.key]:null;});
  const byKey=Object.fromEntries(earned.map(e=>[e.key,e]));
  const share=(list,i,n)=>list.filter((_,k)=>k%n===i);
  const dims=GAP_DIMENSIONS.map((d,i)=>{
    const b=byKey[d.key];
    const pct=b.weight?Math.round(b.pointsEarned/b.weight*100):0;
    return {key:d.key,icon:d.icon,short:d.short,title:d.title,
      subtitle:`${b.pointsEarned} of ${b.weight} points · ${pct}% of this dimension`,
      matched:share(matched,i%3,3).map(l=>({label:l,status:pct>=80?'ok':'partial'})),
      gaps:share(gaps,i%2,2).map(l=>({label:l,status:'gap'})),
      breakdown:b, status:scoreStatus(pct)};
  });
  const lost=100-score;
  return {matchScore:score,dimensions:dims,
    totalScore:score,lostPoints:lost,
    topReasons:dims.filter(d=>d.breakdown.pointsLost>0)
      .sort((a,b)=>b.breakdown.pointsLost-a.breakdown.pointsLost).slice(0,3)
      .map(d=>`${d.short}: ${d.breakdown.reason}`),
    candidate:ctx||{}};
}

function gapScoreRing(score){
  const C=276, off=C-(Math.max(0,Math.min(100,score))/100)*C;
  const stroke=scoreStatus(score)==='ok'?'hsl(var(--brand-success))'
    :scoreStatus(score)==='partial'?'hsl(var(--brand-warning))':'hsl(var(--brand-destructive))';
  return `<div class="relative mx-auto my-0 sm:my-4" style="width:104px;height:104px">
    <svg width="104" height="104" viewBox="0 0 104 104" class="absolute inset-0 -rotate-90 text-muted" aria-hidden>
      <circle cx="52" cy="52" r="44" fill="none" stroke="currentColor" stroke-width="6"></circle></svg>
    <svg width="104" height="104" viewBox="0 0 104 104" class="absolute inset-0 -rotate-90" aria-hidden>
      <circle cx="52" cy="52" r="44" fill="none" stroke="${stroke}" stroke-width="6" stroke-linecap="round"
        stroke-dasharray="${C}" stroke-dashoffset="${off}"></circle></svg>
    <div class="absolute inset-0 flex flex-col items-center justify-center px-2 text-center">
      <span class="text-xl font-semibold leading-none text-foreground">${Math.round(score)}%</span>
      <span class="mt-1 max-w-[4rem] text-[7px] font-medium uppercase leading-tight tracking-wide text-muted-foreground">overall match</span>
    </div></div>`;
}

/* GapAnalysisAccordion.tsx + GapAnalysisSectionBody.tsx */
function gapAccordion(g){
  const open=MODAL.dim||(g.dimensions.find(d=>d.matched.length||d.gaps.length||d.breakdown.pointsLost>0)||{}).key;
  const chipRowFull=chips=>chips.length?`<div class="flex flex-wrap gap-1.5">${chips.map(c=>
    `<span class="${GAP_CHIP_BASE} ${chipStatusClass(c.status)}">${esc(c.label)}</span>`).join('')}</div>`:'';
  const skillChips=(chips,title,tone)=>{
    if(!chips.length)return '';
    const strong=chips.filter(c=>c.status==='ok').length, partial=chips.filter(c=>c.status==='partial').length;
    const meta=title==='Matched'
      ? ((strong||partial)?`<span class="ml-auto font-normal normal-case tracking-normal text-muted-foreground">${strong?strong+' strong':''}${strong&&partial?' · ':''}${partial?partial+' partial':''}</span>`:'')
      : `<span class="ml-auto font-normal normal-case tracking-normal text-muted-foreground">${chips.length} not evidenced</span>`;
    return `<div><p class="mb-2 flex items-center gap-1.5 text-[11px] font-semibold uppercase tracking-wide ${tone}">${title}${meta}</p>${chipRowFull(chips)}</div>`;
  };
  const rowHead=(d,trigger)=>`<div class="flex min-w-0 items-center gap-2 max-sm:gap-1.5 sm:gap-3 ${trigger?'flex-1':'w-full'}">
    <span class="grid h-9 w-9 shrink-0 place-items-center rounded-xl ${badgeStatusClass(d.status)}">${ic(d.icon,'h-4 w-4')}</span>

      title="${d.breakdown.pointsEarned} of ${d.breakdown.weight} points earned">${d.breakdown.pointsEarned}/${d.breakdown.weight}</span>

  </div>`;
  const items=g.dimensions.map(d=>{
    const expandable=d.matched.length||d.gaps.length||d.breakdown.pointsLost>0;
    if(!expandable)return `<div class="overflow-hidden rounded-2xl border border-border bg-card"><div class="px-4 py-3.5">${rowHead(d,false)}</div></div>`;
    const isOpen=d.key===open;
    return `<div class="overflow-hidden rounded-2xl border border-border bg-card${isOpen?' shadow-sm':''}">
      <button data-gapdim="${d.key}" class="flex w-full min-w-0 items-center gap-2 px-4 py-3.5 text-left transition-all hover:bg-muted/30 max-sm:px-3 max-sm:py-3">
        ${rowHead(d,true)}${ic('chevronDown','h-4 w-4 shrink-0 text-muted-foreground transition-transform duration-200'+(isOpen?' rotate-180':''))}
      </button>
      ${isOpen?`<div class="space-y-4 border-t border-border/60 px-4 pb-4 pt-1 max-sm:px-3 max-sm:pb-3">
        ${d.breakdown.pointsLost>0?`<p class="flex gap-2 text-xs leading-relaxed text-muted-foreground">
          ${ic('alertTriangle','mt-0.5 h-3.5 w-3.5 shrink-0 text-brand-warning')}
          <span><span class="font-medium text-foreground">${d.breakdown.pointsLost} of ${d.breakdown.weight} points lost</span>${d.breakdown.reason?' — '+esc(d.breakdown.reason):''}</span></p>`:''}
        ${skillChips(d.matched,'Matched','text-brand-success')}
        ${skillChips(d.gaps,'Missing','text-brand-destructive')}
      </div>`:''}
    </div>`;
  }).join('');
  return `<div class="flex min-w-0 flex-1 flex-col md:min-h-0">
    <div class="min-w-0 overflow-x-hidden px-4 py-5 max-sm:px-3 max-sm:py-4 sm:px-6 md:min-h-0 md:flex-1 md:overflow-y-auto thin-scroll">
      <div class="space-y-2.5">${items}</div>

}

  const q=marketQuery.trim().toLowerCase();
  const list=MARKET_JOBS.filter(j=>{
    if(q&&![j.title,j.companyName].join(' ').toLowerCase().includes(q))return false;
    if(marketCountries.length){
      /* Every seeded posting is US or India; the filter reads the location text. */
      const inCountry=marketCountries.some(c=>j.location.includes(c)||(c==='United States'&&/\b(US|TX|CA|NY|Remote \(US\))\b/.test(j.location)));
      if(!inCountry)return false;

  const countryLabel=marketCountries.length===0?'All Countries'
    :marketCountries.length===1?marketCountries[0]:`${marketCountries.length} countries`;

  const body=list.length?`<div class="grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-3">${list.map(marketJobCard).join('')}</div>

    :`<div class="rounded-2xl border border-border bg-card p-12 text-center shadow-sm">

        <h3 class="mb-2 text-xl font-bold">No Jobs Found</h3>
        <p class="mb-6 text-muted-foreground">${q||marketCountries.length?'No jobs match your search criteria. Try adjusting your filters.':'No jobs available at the moment. Check back soon!'}</p>
      </div>`;

  $('view-market').innerHTML=`
  <main class="space-y-6 px-2 py-4 sm:px-4 md:px-6">
    <div>
      <h1 class="text-2xl font-extrabold leading-tight tracking-tight text-brand-gradient sm:text-3xl">Job Marketplace</h1>
      <p class="mt-1 text-sm text-muted-foreground">Search for open roles and refer candidates that would be a great fit.</p>
    </div>

    <div class="rounded-2xl border border-border bg-card p-5 shadow-sm sm:p-6">
      <div class="flex flex-col gap-6 lg:flex-row lg:items-start lg:gap-3">
        ${MARKETPLACE_STEPS.map(([t,d],i)=>`
          <div class="flex min-w-0 flex-1 items-start gap-3">
            <span class="grid h-8 w-8 shrink-0 place-items-center rounded-full bg-brand-gradient text-sm font-extrabold text-brand-foreground shadow-brand-cta">${i+1}</span>
            <div class="min-w-0 flex-1 pt-0.5">
              <p class="text-sm font-bold leading-snug text-foreground">${esc(t)}</p>
              <p class="mt-1 text-xs leading-relaxed text-muted-foreground">${esc(d)}</p>
            </div>
          </div>
          ${i<MARKETPLACE_STEPS.length-1?`<span aria-hidden class="mx-1 hidden shrink-0 self-center text-muted-foreground/50 lg:block">${ic('arrowRight','h-5 w-5')}</span>`:''}`).join('')}
      </div>
    </div>

    <div class="flex flex-col items-stretch justify-between gap-3 sm:flex-row sm:items-center">
      <span class="text-sm text-muted-foreground">Showing <span class="font-semibold text-foreground">${list.length}</span> of ${MARKET_JOBS.length} jobs</span>
      <div class="flex w-full flex-col gap-2 sm:w-auto sm:flex-row sm:items-center">
        ${routeSearchInput('mkSearch',marketQuery,'Search by title, company...','w-full sm:w-72')}

          <div class="relative min-w-0 flex-1 sm:flex-none">
            <button id="mkCountry" aria-label="Filter by country" class="${btn('outline','none','h-10 w-full min-w-0 justify-between rounded-xl border-border bg-card px-3 text-sm font-medium shadow-sm hover:border-brand-amethyst/20 hover:bg-brand-amethyst/10 hover:text-brand-amethyst sm:w-[220px] sm:shrink-0')}">
              <span class="flex min-w-0 items-center gap-2 truncate">${ic('globe','h-4 w-4 shrink-0 text-brand-amethyst')}<span class="truncate">${esc(countryLabel)}</span></span>
              ${ic('chevronDown','h-4 w-4 shrink-0 opacity-50')}</button>
            ${marketCountryOpen?`<div class="absolute right-0 z-50 mt-1 w-[220px] rounded-md border bg-popover p-2 text-popover-foreground shadow-md">
              <label class="flex cursor-pointer items-center gap-2 rounded-md px-2 py-2 hover:bg-muted/50">
                <button data-mkall="1" class="flex items-center gap-2">${CHK(marketCountries.length===0)}<span class="text-sm">All Countries</span></button></label>
              <div class="border-t border-border/60 pt-1">
                ${MARKET_COUNTRIES.map(c=>`<label class="flex cursor-pointer items-center gap-2 rounded-md px-2 py-2 hover:bg-muted/50">
                  <button data-mkc="${esc(c)}" class="flex items-center gap-2">${CHK(marketCountries.includes(c))}<span class="text-sm">${esc(c)}</span></button></label>`).join('')}
              </div></div>`:''}
          </div>
          <button id="mkRefresh" aria-label="Refresh job listings" class="${btn('outline','sm','h-10 shrink-0 gap-2')}">${ic('refreshCw','h-4 w-4')}<span class="hidden sm:inline">Refresh</span></button>

    <div class="grid grid-cols-1 items-start gap-5"><div class="min-w-0">${body}</div></div>
  </main>`;

  const v=$('view-market');
  const s=$('mkSearch');
  if(s)s.oninput=()=>{marketQuery=s.value;renderMarket();keepCaret('mkSearch');};
  v.querySelectorAll('[data-clear]').forEach(el=>el.onclick=()=>{marketQuery='';renderMarket();});
  $('mkCountry').onclick=e=>{e.stopPropagation();marketCountryOpen=!marketCountryOpen;renderMarket();};
  $('mkRefresh').onclick=()=>toast('Refreshed','Job listings are up to date.');
  v.querySelectorAll('[data-mkall]').forEach(el=>el.onclick=e=>{e.stopPropagation();marketCountries=[];renderMarket();});
  v.querySelectorAll('[data-mkc]').forEach(el=>el.onclick=e=>{
    e.stopPropagation();const c=el.dataset.mkc;
    marketCountries=marketCountries.includes(c)?marketCountries.filter(x=>x!==c):marketCountries.concat(c);
    renderMarket();});
  v.querySelectorAll('[data-mkview]').forEach(el=>el.onclick=e=>{
    e.stopPropagation();toast('Job Details','The job details drawer is outside the scope of this prototype.');});
  v.querySelectorAll('[data-mkrefer]').forEach(el=>el.onclick=e=>{
    e.stopPropagation();toast('Refer a Candidate','The resume upload flow is outside the scope of this prototype.');});
  v.querySelectorAll('[data-mkshare]').forEach(el=>el.onclick=e=>{
    e.stopPropagation();toast('Share Job','The share modal is outside the scope of this prototype.');});
}

/* ============================================================================
   RECRUITMENT FINANCE — FinancesNew.tsx + components/finance/recruitment/*
   Connector Earnings · Requester Spending · My Bonuses
   ============================================================================ */
const PAGE_STAT_CARD="relative flex flex-wrap items-center gap-3 overflow-hidden rounded-2xl border border-border bg-card px-[18px] py-[13px] shadow-sm w-full lg:w-[210px]";
const FIN_TH="text-[11px] uppercase tracking-wider font-bold text-muted-foreground h-12 text-left align-middle";

/* Payout status — ConnectorEarningTable / CandidateBonusTable */
const PAYOUT_STATUS={
  pending:{label:'Pending',icon:'clock',className:'bg-amber-500/15 text-amber-700 border-amber-500/30'},
  onboarding_pending:{label:'Awaiting Setup',icon:'alertCircle',className:'bg-amber-500/15 text-amber-700 border-amber-500/30'},
  queued:{label:'Processing',icon:'clock',className:'bg-blue-500/15 text-blue-700 border-blue-500/30'},
  processing:{label:'Processing',icon:'clock',className:'bg-blue-500/15 text-blue-700 border-blue-500/30'},
  completed:{label:'Paid',icon:'checkCircle2',className:'bg-emerald-500/15 text-emerald-700 border-emerald-500/30'},
  failed:{label:'Failed',icon:'xCircle',className:'bg-red-500/15 text-red-700 border-red-500/30'},
  manual_review:{label:'Under Review',icon:'alertCircle',className:'bg-amber-500/15 text-amber-700 border-amber-500/30'},
  cancelled:{label:'Cancelled',icon:'ban',className:'bg-slate-500/15 text-slate-700 border-slate-500/30'},
};
/* Transaction status — spending-table/spendingTableUtils.ts (no icons) */
const TXN_STATUS={
  pending:{label:'Pending',className:'border-brand-warning/30 bg-brand-warning/15 text-brand-warning'},
  authorized:{label:'Authorized',className:'border-blue-500/30 bg-blue-500/15 text-blue-700'},
  captured:{label:'Paid',className:'border-emerald-500/30 bg-emerald-500/15 text-emerald-700'},
  cancelled:{label:'Cancelled',className:'border-slate-500/30 bg-slate-500/15 text-slate-700'},
};
const TXN_TYPE={
  interview_cost:['Placement Fee','border-border bg-muted/60 text-muted-foreground'],
  flat_deposit:['Referral Deposit','border-transparent bg-brand-sky/10 text-brand-sky'],
  flat_topup:['Referral Top-up','border-transparent bg-brand-amethyst/10 text-brand-amethyst'],
  success_fee:['Success Fee','border-border bg-muted/60 text-muted-foreground'],
  success_fee_topup:['Success Fee Top-up','border-transparent bg-brand-amethyst/10 text-brand-amethyst'],
};
const payoutBadge=k=>{const c=PAYOUT_STATUS[k]||PAYOUT_STATUS.pending;
  return `<span class="${BADGE} ${BADGE_OUTLINE} inline-flex items-center gap-1 whitespace-nowrap px-2 py-1 text-xs font-medium ${c.className}">${ic(c.icon,'h-3 w-3')}${c.label}</span>`;};
const txnBadge=k=>{const c=TXN_STATUS[k]||TXN_STATUS.pending;
  return `<span class="${BADGE} ${BADGE_OUTLINE} whitespace-nowrap px-2.5 py-1 text-[11px] font-bold ${c.className}">${c.label}</span>`;};
const money2f=n=>'$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});

/* --- fixtures, all derived from the hired candidates in the seeded board ---- */
const HIRED=[];
JOBS.forEach(j=>CANDIDATES[j.id].filter(c=>c.stage==='hired').forEach((c,k)=>HIRED.push({j,c,k})));
const PAYOUT_CYCLE=['completed','pending','processing','onboarding_pending','manual_review','failed','cancelled'];
const EARNINGS=HIRED.map(({j,c,k},i)=>{
  const seed=JOBS.indexOf(j)*5+i;
  return {id:'e'+(i+1),jobTitle:j.title,companyName:j.company,
    candidateLabel:c.revealedName||`${FIRST[seed%FIRST.length]} ${LAST[(seed*3)%LAST.length]}`,
    earnedAmount:j.perCandidate*0.7,creditsApplied:i%4===0?25:0,
    processingStatus:PAYOUT_CYCLE[i%PAYOUT_CYCLE.length],isShared:i%5===0,
    createdAt:isoPlus(-(8+i*6))};
});
const BONUSES=HIRED.slice(0,6).map(({j},i)=>({id:'b'+(i+1),jobTitle:j.title,companyName:j.company,
  earnedAmount:i===3?null:j.successFee?j.successFee*0.2:400,
  processingStatus:PAYOUT_CYCLE[(i+2)%PAYOUT_CYCLE.length],
  payoutStatus:i===5?'cancelled':'active',createdAt:isoPlus(-(14+i*9))}));
const SPENDING=JOBS.filter(j=>j.status==='active').slice(0,3).map((j,ji)=>({
  jobId:j.id,jobTitle:j.title,companyName:j.company,
  /* Two revealed candidates plus one still pre-acceptance, so the masked
     identity row is reachable. */
  candidates:CANDIDATES[j.id].filter(c=>REVEALED_STAGES.has(c.stage)).slice(0,2)
    .concat(CANDIDATES[j.id].filter(c=>c.stage==='shortlisted').slice(0,1)).map((c,ci)=>{
    const seed=ji*7+ci*3;
    const name=c.revealedName||`${FIRST[seed%FIRST.length]} ${LAST[(seed*3)%LAST.length]}`;
    const txns=[['interview_cost',j.perCandidate,'captured'],['flat_deposit',j.perCandidate*2.5,ci%2?'authorized':'captured'],
                ['success_fee',(j.successFee||0)*0.5,ci===0?'pending':'cancelled']]
      .filter(t=>t[1]>0)
      .map((t,ti)=>({id:(j.id+'-'+ci+'-'+ti+'-txn0000').replace(/-/g,''),transactionType:t[0],
        totalAmount:Math.round(t[1]),status:t[2],createdAt:isoPlus(-(20+ti*4+ci))}));
    return {candidateId:c.id,candidateLabel:name,candidateEmail:c.revealedEmail,
      revealed:!!c.revealedName,transactions:txns,
      totalAmount:txns.reduce((n,t)=>n+t.totalAmount,0)};
  }),
})).map(g=>Object.assign(g,{totalAmount:g.candidates.reduce((n,c)=>n+c.totalAmount,0)}));

const finState={tab:'connector',q:'',page:1,openJob:null,openCand:null};
const FIN_PAGE_SIZE=6;

function finStat(label,icon,value){
  return `<div class="${PAGE_STAT_CARD}">
    <div class="grid h-[38px] w-[38px] shrink-0 place-items-center rounded-[11px] bg-brand-amethyst/10 text-brand-amethyst">${ic(icon,'h-[17px] w-[17px]')}</div>
    <div class="min-w-[104px] flex-1">
      <p class="mb-0.5 text-[10px] font-bold uppercase tracking-[0.09em] text-muted-foreground">${label}</p>
      <div class="text-xl font-extrabold leading-none tracking-tight text-foreground">${value}</div></div></div>`;
}
function finPager(page,total,noun){
  const pages=Math.max(1,Math.ceil(total/FIN_PAGE_SIZE));
  if(pages<=1)return '';
  const from=total===0?0:(page-1)*FIN_PAGE_SIZE+1, to=Math.min(page*FIN_PAGE_SIZE,total);
  const nums=Array.from({length:pages},(_,i)=>i+1).slice(0,5);
  return `<div class="flex flex-col items-center justify-between gap-4 px-1 pt-2 sm:flex-row">
    <p class="text-sm text-muted-foreground">Showing <span class="font-medium text-foreground">${from}</span> to
      <span class="font-medium text-foreground">${to}</span> of <span class="font-medium text-foreground">${total}</span> ${noun}</p>
    <div class="flex items-center gap-1">
      <button data-finpage="${page-1}" ${page<=1?'disabled':''} aria-label="Previous page" class="${btn('outline','sm','h-8')}">${ic('chevronLeft','h-4 w-4')}<span class="ml-1 hidden sm:inline">Previous</span></button>
      <div class="flex items-center gap-1 px-2">${nums.map(n=>`<button data-finpage="${n}" class="${btn('ghost','sm','h-8 w-8 p-0 '+(n===page?'border-transparent bg-brand-gradient text-brand-foreground shadow-brand-cta hover:text-brand-foreground':'hover:bg-brand-amethyst/10 hover:text-brand-amethyst'))}">${n}</button>`).join('')}</div>
      <button data-finpage="${page+1}" ${page>=pages?'disabled':''} aria-label="Next page" class="${btn('outline','sm','h-8')}"><span class="mr-1 hidden sm:inline">Next</span>${ic('chevronRight','h-4 w-4')}</button>
    </div></div>`;
}
function finEmpty(icon,title,copy,cta){
  return `<div class="flex flex-col items-center justify-center py-20">
    <div class="mb-4 grid h-16 w-16 place-items-center rounded-2xl bg-brand-amethyst/10 text-brand-amethyst">${ic(icon,'h-8 w-8')}</div>
    <h3 class="mb-1 text-lg font-semibold">${esc(title)}</h3>
    <p class="max-w-sm text-center text-sm text-muted-foreground">${esc(copy)}</p>
    ${cta?`<button data-fincta="${esc(cta[1])}" class="${btn('brand','default','mt-4')}">${esc(cta[0])}</button>`:''}</div>`;
}
function finFilterBar(placeholder){
  return `<div class="flex flex-col gap-3"><div class="flex items-center gap-2 lg:gap-3">
    ${routeSearchInput('finSearch',finState.q,placeholder,'min-w-0 flex-1')}
    <button data-finfilters="1" class="${btn('outline','none','h-10 shrink-0 gap-2 rounded-xl transition-colors hover:border-brand-amethyst/20 hover:bg-brand-amethyst/10 hover:text-brand-amethyst lg:hidden')}">${ic('slidersHorizontal','h-4 w-4')}</button>
    <div class="hidden shrink-0 items-center gap-3 lg:flex lg:flex-wrap lg:justify-end">
      <select class="${SELECT} w-full rounded-xl bg-background lg:w-[180px]"><option>All statuses</option><option>Pending</option><option>Processing</option><option>Paid</option><option>Failed</option></select>
      <span class="flex items-center gap-2">${ic('calendar','h-4 w-4 text-muted-foreground')}<span class="text-sm text-muted-foreground">Date:</span>
        <select class="${SELECT} w-[150px] rounded-xl bg-background"><option>All time</option><option>Last 7 days</option><option>Last 30 days</option></select></span>
    </div></div></div>`;
}

/* --- Connector Earnings ---------------------------------------------------- */
function finConnector(){
  const q=finState.q.trim().toLowerCase();
  const rows=EARNINGS.filter(e=>!q||[e.jobTitle,e.companyName,e.candidateLabel].join(' ').toLowerCase().includes(q));
  const page=Math.min(finState.page,Math.max(1,Math.ceil(rows.length/FIN_PAGE_SIZE)));
  const slice=rows.slice((page-1)*FIN_PAGE_SIZE,page*FIN_PAGE_SIZE);
  const sortHead=(label,k)=>`<th class="min-w-[140px] ${FIN_TH}"><button class="flex h-auto items-center gap-1.5 p-0 transition-colors hover:bg-transparent">${label}${ic('chevronsUpDown','h-3 w-3 opacity-40')}</button></th>`;
  const body=slice.map(e=>`<tr class="group border-b border-border/50 transition-colors hover:bg-brand-amethyst/5">
    <td class="py-4 pr-3"><div class="flex flex-col"><span class="font-medium text-foreground">${esc(e.jobTitle)}</span>
      <span class="text-xs text-muted-foreground">${esc(e.companyName)}</span></div></td>
    <td class="py-4 pr-3"><span class="text-sm text-foreground">${esc(e.candidateLabel)}</span></td>
    <td class="py-4 pr-3"><div class="flex flex-col items-start gap-1">
      <span class="text-sm font-semibold text-emerald-600">${money2f(e.earnedAmount)}</span>
      ${e.creditsApplied>0?`<span class="inline-flex items-center rounded border border-violet-500/30 bg-violet-500/15 px-1.5 py-0.5 text-[10px] font-medium text-violet-700">– ${money2f(e.creditsApplied)} credit</span>`:''}
    </div></td>
    <td class="py-4 pr-3"><div class="flex flex-col items-start gap-1">${payoutBadge(e.processingStatus)}
      ${e.isShared?`<span class="${BADGE} ${BADGE_OUTLINE} inline-flex items-center gap-1 whitespace-nowrap border-violet-500/30 bg-violet-500/15 px-1.5 py-0.5 text-[10px] font-medium text-violet-700">${ic('users','h-2.5 w-2.5')}Shared Earning</span>`:''}
    </div></td>
    <td class="py-4 pr-3"><span class="whitespace-nowrap text-sm text-foreground">${fmtDateTime(e.createdAt)}</span></td>
    <td class="py-4 text-center"><button data-finview="earning" aria-label="View earning details" class="${btn('outline','sm','h-7 w-7 p-0')}">${ic('eye','h-3.5 w-3.5')}</button></td>
  </tr>`).join('');
  return rows.length?`${finFilterBar('Search by job title or company...')}
    <div class="overflow-x-auto thin-scroll"><table class="w-full min-w-[900px] caption-bottom text-sm">
      <thead><tr class="border-b border-border hover:bg-transparent">
        <th class="min-w-[180px] ${FIN_TH}">Job</th><th class="min-w-[150px] ${FIN_TH}">Candidate</th>
        ${sortHead('You Earned','amount')}${sortHead('Status','status')}${sortHead('Date','date')}
        <th class="min-w-[70px] ${FIN_TH} !text-center">Action</th></tr></thead>
      <tbody>${body}</tbody></table></div>
    ${finPager(page,rows.length,'earnings')}`
  :finEmpty('wallet','No Earnings Yet',finState.q?'Try adjusting your search or filters':'Your earnings will appear here once a candidate you connected is shortlisted',finState.q?null:['Refer Candidates','refer']);
}

/* --- Requester Spending (three-level grouped table) ------------------------- */
function finRequester(){
  const q=finState.q.trim().toLowerCase();
  const groups=SPENDING.filter(g=>!q||[g.jobTitle,g.companyName].join(' ').toLowerCase().includes(q));
  const caret=open=>ic('chevronDown','h-4 w-4 shrink-0 text-muted-foreground transition-transform duration-200'+(open?'':' -rotate-90'));
  const AV=['bg-gradient-to-br from-brand-amethyst to-brand-rose','bg-gradient-to-br from-brand-sky to-brand-amethyst',
            'bg-gradient-to-br from-brand-success to-brand-sky','bg-gradient-to-br from-brand-rose to-brand-amethyst'];
  const dateCell=iso=>`<span class="whitespace-nowrap font-mono text-xs font-medium text-foreground/80">${fmtDate(iso)}<span class="text-muted-foreground"> · ${new Date(iso).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'UTC'})}</span></span>`;
  const rows=groups.map((g,gi)=>{
    const jobOpen=finState.openJob===g.jobId;
    let out=`<tr class="border-y border-border bg-background hover:bg-muted/40">
      <td colspan="2" class="px-[18px] py-[13px] text-left align-middle">
        <button data-finjob="${g.jobId}" class="flex h-auto w-full min-w-0 items-center justify-start gap-2.5 p-0 text-left font-normal hover:bg-transparent">
          ${caret(jobOpen)}
          <span class="min-w-0 flex-1"><span class="block truncate text-[14.5px] font-medium tracking-[-0.01em] text-foreground">${esc(g.jobTitle)}</span>
            <span class="block truncate text-xs font-normal text-muted-foreground">${esc(g.companyName)}</span></span>
          <span class="whitespace-nowrap rounded-lg border border-border bg-background px-2.5 py-0.5 text-[11.5px] font-bold text-muted-foreground">${g.candidates.length} candidate${g.candidates.length===1?'':'s'}</span>
        </button></td>
      <td class="px-[18px] py-[13px] text-right align-middle"><span class="whitespace-nowrap font-mono text-[15px] font-bold tabular-nums text-brand-gradient">-${money2f(g.totalAmount)}</span></td>
      <td class="max-[980px]:hidden px-[18px] py-[13px] align-middle"><span class="text-xs font-semibold text-muted-foreground">Job total</span></td>
      <td class="max-[980px]:hidden px-[18px] py-[13px] align-middle"><span class="text-xs text-muted-foreground">—</span></td>
      <td class="max-[980px]:hidden px-[18px] py-[13px] text-center align-middle"><span class="text-xs text-muted-foreground">—</span></td></tr>`;
    if(!jobOpen)return out;
    g.candidates.forEach((c,ci)=>{
      const cOpen=finState.openCand===c.candidateId;
      const pending=c.transactions.filter(t=>t.status==='pending').length;
      out+=`<tr class="border-b border-border bg-background hover:bg-muted/40${cOpen?' bg-muted/40':''}">
        <td class="py-[13px] pl-[42px] pr-[18px] align-middle"><button data-fincand="${c.candidateId}" class="flex items-center p-0 hover:bg-transparent">${caret(cOpen)}</button></td>
        <td class="py-[13px] pr-[18px] align-middle"><div class="flex min-w-0 items-center gap-2.5">
          <span class="grid h-8 w-8 shrink-0 place-items-center rounded-[10px] text-[11.5px] font-bold text-brand-foreground ${AV[(gi+ci)%4]}">${c.revealed?esc(initials(c.candidateLabel,'')):'#'}</span>
          <span class="min-w-0"><span class="block truncate text-[13.5px] font-medium text-foreground">${esc(c.candidateLabel)}</span>
            <span class="block truncate text-[11.5px] text-muted-foreground">${c.revealed&&c.candidateEmail?esc(c.candidateEmail):'Identity hidden until accepted'}</span></span></div></td>
        <td class="px-[18px] py-[13px] text-right align-middle"><span class="whitespace-nowrap font-mono text-[13px] font-bold tabular-nums text-foreground">-${money2f(c.totalAmount)}</span></td>
        <td class="max-[980px]:hidden px-[18px] py-[13px] align-middle">${pending>0?`<span class="${BADGE} ${BADGE_OUTLINE} whitespace-nowrap border-brand-warning/30 bg-brand-warning/15 px-2.5 py-1 text-[11px] font-bold text-brand-warning">${pending} pending</span>`:txnBadge('captured')}</td>
        <td class="max-[980px]:hidden px-[18px] py-[13px] align-middle"><span class="text-xs text-muted-foreground">—</span></td>
        <td class="max-[980px]:hidden px-[18px] py-[13px] text-center align-middle"><span class="text-xs text-muted-foreground">—</span></td></tr>`;
      if(!cOpen)return;
      c.transactions.forEach(t=>{
        const ty=TXN_TYPE[t.transactionType];
        out+=`<tr class="border-b border-border bg-background hover:bg-muted/40">
          <td class="py-[13px] pl-[66px] pr-[18px] align-middle"><div class="flex items-center">
            <span class="-mt-[9px] mr-2 h-[13px] w-[13px] shrink-0 rounded-bl-[5px] border-b-[1.5px] border-l-[1.5px] border-border"></span>
            <span class="inline-flex whitespace-nowrap rounded-lg border px-2.5 py-1 text-[10px] font-extrabold uppercase tracking-[0.07em] ${ty[1]}">${ty[0]}</span></div></td>
          <td class="py-[13px] pr-[18px] align-middle"><span class="truncate font-mono text-xs font-semibold text-muted-foreground">#${t.id.slice(0,8).toUpperCase()}</span></td>
          <td class="px-[18px] py-[13px] text-right align-middle"><span class="whitespace-nowrap font-mono text-[13px] font-bold tabular-nums text-foreground">-${money2f(t.totalAmount)}</span></td>
          <td class="max-[980px]:hidden px-[18px] py-[13px] align-middle">${txnBadge(t.status)}</td>
          <td class="max-[980px]:hidden px-[18px] py-[13px] align-middle">${dateCell(t.createdAt)}</td>
          <td class="max-[980px]:hidden px-[18px] py-[13px] text-center align-middle">
            <button data-finview="receipt" aria-label="View transaction details" class="${btn('outline','sm','h-[30px] w-[30px] p-0 text-muted-foreground hover:border-brand-amethyst/20 hover:bg-brand-amethyst/10 hover:text-brand-amethyst')}">${ic('eye','h-[15px] w-[15px]')}</button></td></tr>`;
      });
    });
    return out;
  }).join('');
  const HEAD="h-auto bg-muted/40 px-[18px] py-3.5 text-[10.5px] font-bold uppercase tracking-[0.11em] text-muted-foreground text-left align-middle";
  return groups.length?`${finFilterBar('Search by job title, candidate, or amount...')}
    <div class="overflow-x-auto thin-scroll"><table class="w-full min-w-[900px] table-fixed caption-bottom text-sm">
      <colgroup><col class="w-[27%]"><col class="w-[27%]"><col class="w-[13%]"><col class="w-[12%]"><col class="w-[15%]"><col class="w-[6%]"></colgroup>
      <thead><tr><th class="${HEAD}">Job</th><th class="${HEAD}">Candidate</th><th class="${HEAD} !text-right">Amount</th>
        <th class="${HEAD} max-[980px]:hidden">Status</th><th class="${HEAD} max-[980px]:hidden">Date</th>
        <th class="${HEAD} max-[980px]:hidden !text-center">Action</th></tr></thead>
      <tbody class="[&_tr:last-child]:border-b">${rows}</tbody></table></div>`
  :finEmpty('receipt','No Spending Records Found',finState.q?'Try adjusting your search or filters':'Your spending history will appear here once you shortlist candidates',finState.q?null:['My Job Posts','jobs']);
}

/* --- My Bonuses ------------------------------------------------------------ */
function finCandidate(){
  const q=finState.q.trim().toLowerCase();
  const rows=BONUSES.filter(b=>!q||[b.jobTitle,b.companyName].join(' ').toLowerCase().includes(q));
  const page=Math.min(finState.page,Math.max(1,Math.ceil(rows.length/FIN_PAGE_SIZE)));
  const slice=rows.slice((page-1)*FIN_PAGE_SIZE,page*FIN_PAGE_SIZE);
  const amount=b=>b.earnedAmount==null?'<span class="text-sm font-semibold text-muted-foreground">—</span>'
    :b.payoutStatus==='cancelled'?`<span class="text-sm font-semibold text-muted-foreground line-through decoration-1">${money2f(b.earnedAmount)}</span>`
    :`<span class="text-sm font-semibold text-emerald-600">${money2f(b.earnedAmount)}</span>`;
  const body=slice.map(b=>`<tr class="group border-b border-border/50 transition-colors hover:bg-brand-amethyst/5">
    <td class="py-4 pr-3"><span class="font-medium text-foreground">${esc(b.jobTitle)}</span></td>
    <td class="py-4 pr-3"><span class="text-sm text-muted-foreground">${esc(b.companyName)}</span></td>
    <td class="py-4 pr-3">${amount(b)}</td>
    <td class="py-4 pr-3">${payoutBadge(b.payoutStatus==='cancelled'?'cancelled':b.processingStatus)}</td>
    <td class="py-4 pr-3"><span class="whitespace-nowrap text-sm text-foreground">${fmtDateTime(b.createdAt)}</span></td>
    <td class="py-4 text-center"><button data-finview="bonus" aria-label="View bonus details" class="${btn('outline','sm','h-7 w-7 p-0')}">${ic('eye','h-3.5 w-3.5')}</button></td>
  </tr>`).join('');
  return rows.length?`${finFilterBar('Search by job title or company...')}
    <div class="overflow-x-auto thin-scroll"><table class="w-full min-w-[900px] caption-bottom text-sm">
      <thead><tr class="border-b border-border hover:bg-transparent">
        <th class="min-w-[180px] ${FIN_TH}">Job</th><th class="min-w-[150px] ${FIN_TH}">Company</th>
        <th class="min-w-[140px] ${FIN_TH}">You Earned</th><th class="min-w-[140px] ${FIN_TH}">Status</th>
        <th class="min-w-[140px] ${FIN_TH}">Date</th><th class="min-w-[70px] ${FIN_TH} !text-center">Action</th></tr></thead>
      <tbody>${body}</tbody></table></div>
    ${finPager(page,rows.length,'bonuses')}`
  :finEmpty('award','No Bonuses Yet',finState.q?'Try adjusting your search or filters':"Your success bonuses will appear here once you're hired and onboarded",null);
}

function renderFinance(){
  const totalEarn=EARNINGS.reduce((n,e)=>n+e.earnedAmount,0);
  const pending=EARNINGS.filter(e=>e.processingStatus!=='completed'&&e.processingStatus!=='cancelled')
    .reduce((n,e)=>n+e.earnedAmount,0);
  const stats=finState.tab==='connector'
    ? finStat('Total Earnings','dollarSign',money2f(totalEarn))+finStat('Pending Payouts','clock',money2f(pending))
    : finState.tab==='requester'
    ? finStat('Total Spent','trendingUp',money2f(SPENDING.reduce((n,g)=>n+g.totalAmount,0)))+
      finStat('Upcoming Payments','clock',money2f(SPENDING.reduce((n,g)=>n+g.candidates.reduce((m,c)=>m+c.transactions.filter(t=>t.status!=='captured'&&t.status!=='cancelled').reduce((k,t)=>k+t.totalAmount,0),0),0)))
    : '';
  const tab=(v,label,icon)=>`<button data-fintab="${v}" data-state="${finState.tab===v?'active':'inactive'}"
    class="inline-flex shrink-0 items-center justify-center gap-2 rounded-lg px-4 py-1.5 text-sm font-semibold transition-all sm:px-5 ${finState.tab===v?'bg-card text-brand-amethyst shadow-sm':'text-muted-foreground hover:text-foreground'}">
    ${ic(icon,'h-4 w-4 shrink-0')}<span class="whitespace-nowrap">${label}</span></button>`;
  const panel=finState.tab==='connector'?finConnector():finState.tab==='requester'?finRequester():finCandidate();

  $('view-finance').innerHTML=`
  <main class="space-y-6 px-2 py-4 sm:px-4 md:px-6">
    <div class="space-y-6">
      <div class="flex flex-col gap-4 lg:min-h-[64px] lg:flex-row lg:items-center lg:justify-between">
        <div class="mb-0 min-w-0 lg:min-w-0 lg:flex-1">
          <h1 class="text-[26px] font-extrabold leading-[1.1] tracking-[-0.02em] text-brand-gradient">Recruitment Finance</h1>
          <p class="mt-[5px] text-[14px] text-muted-foreground">Track connector payouts and candidate bonuses in one place.</p>
        </div>
        <div class="w-full shrink-0 lg:w-[640px]">
          <div class="flex w-full flex-col items-stretch lg:min-h-[64px] lg:items-start lg:justify-end">
            <div class="flex w-full flex-col gap-2.5 sm:gap-3 lg:flex-row lg:flex-wrap lg:justify-end">${stats}</div>
          </div>
        </div>
      </div>

      <div class="mb-6"><div class="min-w-0 overflow-hidden rounded-2xl border border-border bg-card p-3 shadow-sm sm:p-3.5">
        <div class="flex h-auto w-full flex-nowrap items-center justify-start gap-1 overflow-x-auto rounded-xl border border-border bg-muted p-1 shadow-none thin-scroll">
          ${tab('connector','Connector Earnings','users')}${tab('requester','Requester Spending','receipt')}${tab('candidate','My Bonuses','award')}
        </div></div></div>

      <div class="rounded-2xl border border-border bg-card shadow-md">
        <div class="space-y-5 p-4 pt-6 md:p-6">${panel}</div>
      </div>
    </div>
  </main>`;

  const v=$('view-finance');
  v.querySelectorAll('[data-fintab]').forEach(el=>el.onclick=()=>{
    if(finState.tab===el.dataset.fintab)return;
    finState.tab=el.dataset.fintab;finState.page=1;finState.openJob=null;finState.openCand=null;renderFinance();});
  const s=$('finSearch');
  if(s)s.oninput=()=>{finState.q=s.value;finState.page=1;renderFinance();keepCaret('finSearch');};
  v.querySelectorAll('[data-clear]').forEach(el=>el.onclick=()=>{finState.q='';renderFinance();});
  v.querySelectorAll('[data-finpage]').forEach(el=>el.onclick=()=>{
    const n=+el.dataset.finpage;if(n>=1){finState.page=n;renderFinance();}});
  v.querySelectorAll('[data-finjob]').forEach(el=>el.onclick=()=>{
    finState.openJob=finState.openJob===el.dataset.finjob?null:el.dataset.finjob;
    finState.openCand=null;renderFinance();});
  v.querySelectorAll('[data-fincand]').forEach(el=>el.onclick=()=>{
    finState.openCand=finState.openCand===el.dataset.fincand?null:el.dataset.fincand;renderFinance();});
  v.querySelectorAll('[data-finview]').forEach(el=>el.onclick=()=>toast('Details','This detail modal is outside the scope of this prototype.'));
  v.querySelectorAll('[data-finfilters]').forEach(el=>el.onclick=()=>toast('Filters','The mobile filter sheet is outside the scope of this prototype.'));
  v.querySelectorAll('[data-fincta]').forEach(el=>el.onclick=()=>setView(el.dataset.fincta));
}

/* ============================================================================
   HEADER PROFILE MENU — DashboardLayout.tsx (profileDropdownTrigger + menu)
   Four items and a sign-out confirmation, shared by the desktop and mobile
   profile pills.
   ============================================================================ */
const DD_SEPARATOR='<div class="-mx-1 my-1 h-px bg-muted"></div>';
const PROFILE_MENU=[
  {t:'Share The Love',i:'heart',cls:'text-pink-500'},
  {t:'Profile',i:'user',act:'profile'},
  {t:'Subscription',i:'crown',act:'subscription'},
  {sep:true},
  {t:'Sign Out',i:'logOut',item:'text-red-600',act:'signout'},
];
function openProfileMenu(anchor){
  closeMenu();
  const r=anchor.getBoundingClientRect();
  const el=document.createElement('div');
  el.className="fixed z-[80] w-56 overflow-hidden rounded-xl border bg-background p-1.5 text-popover-foreground shadow-lg";
  el.style.top=(r.bottom+6)+'px';
  el.style.left=Math.max(8,Math.min(r.right-224,innerWidth-232))+'px';
  el.innerHTML=PROFILE_MENU.map((m,i)=>m.sep?DD_SEPARATOR
    :`<button data-pm="${i}" class="${DD_ITEM} w-full ${m.item||''}">${ic(m.i,'h-4 w-4 mr-2 '+(m.cls||''))}${esc(m.t)}</button>`).join('');
  el.querySelectorAll('[data-pm]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();closeMenu();
    const m=PROFILE_MENU[+b.dataset.pm];
    if(m.act==='signout')openDlg('signout');
    else if(m.act==='profile'){profileSection='profile';setView('profile');}
    else if(m.act==='subscription'){profileSection='subscriptions';setView('profile');}
    else toast(m.t,'This screen is outside the scope of this prototype.');
  });
  $('menuLayer').appendChild(el);
  setTimeout(()=>addEventListener('click',closeMenu,{once:true}),0);
}
['hdProfile','hdProfileM'].forEach(id=>{
  const b=$(id);
  if(b)b.onclick=e=>{e.stopPropagation();openProfileMenu(b);};
});

/* Sign-out confirmation (AlertDialog in DashboardLayout.tsx) */
function dlgSignout(){
  return {wire:()=>{const b=$('modalLayer').querySelector('[data-signout]');
    if(b)b.onclick=()=>{closeDlg();toast('Signed out successfully','You have been logged out of your account.');};},
  html:alertShell({
    title:'<h2 class="text-lg font-semibold">Sign out?</h2>',
    desc:'You will be logged out of Prospectly. You can sign back in anytime.',
    footer:`<button data-dlgcancel class="${btn('outline','default','mt-2 sm:mt-0')}">Stay logged in</button>
      <button data-signout class="${btn('default','default','bg-red-600 text-white hover:bg-red-700')}">Sign out</button>`,
  })};
}

/* ============ INIT ============ */
renderNav();
setView('wizard');

</script>
</body>
</html>
