version: "3.9"

services:

  # ==========================================================
  # BACKEND API
  # ==========================================================

  prospectly:
    container_name: prospectly-dev
    build:
      context: .
      args:
        - SERVER_ENV_BASE64=${SERVER_ENV_BASE64}
    image: prospectly-server:local
    tty: true
    restart: always

    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:-us-east-1}
        awslogs-group: /prospectly/backend
        awslogs-stream-prefix: api
        awslogs-create-group: "true"

    env_file:
      - .env

    environment:
      - NO_COLOR=true

    ports:
      - "127.0.0.1:5001:5001"

    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:5001/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 1800s
      timeout: 5s
      retries: 5
      start_period: 30s


  # ==========================================================
  # BACKEND WORKER
  # ==========================================================

  prospectly-worker:
    container_name: prospectly-worker-dev
    image: prospectly-server:local
    tty: true
    restart: always

    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:-us-east-1}
        awslogs-group: /prospectly/backend
        awslogs-stream-prefix: worker
        awslogs-create-group: "true"

    depends_on:
      prospectly:
        condition: service_healthy

    command: ["node", "dist/src/worker.js"]

    env_file:
      - .env

    environment:
      - NO_COLOR=true

    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:5002/worker/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 1800s
      timeout: 5s
      retries: 5
      start_period: 30s


# ============================================================
# NETWORK
# ============================================================

networks:
  default:
    external: true
    name: prospectly-prod-net
