apiVersion: apps/v1
kind: Deployment
metadata:
  name: prospectly-backend
  namespace: default
  labels:
    app: prospectly-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: prospectly-backend
  template:
    metadata:
      labels:
        app: prospectly-backend
    spec:
      containers:
        - name: prospectly-backend
          image: 466682667800.dkr.ecr.us-west-1.amazonaws.com/test-vishal-prospectly-backend:6514963caf58bd9e4e145375a2e9565ae17face2
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          livenessProbe:
            httpGet:
              path: /api/health # Replace with your actual health check endpoint if different
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          envFrom:
            - configMapRef:
                name: prospectly-backend-config
            - secretRef:
                name: prospectly-backend-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
