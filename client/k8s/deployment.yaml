apiVersion: apps/v1
kind: Deployment
metadata:
  name: prospectly-frontend
  namespace: default
  labels:
    app: prospectly-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: prospectly-frontend
  template:
    metadata:
      labels:
        app: prospectly-frontend
    spec:
      containers:
        - name: prospectly-frontend
          image: prospectly-frontend:latest # TODO: Replace with your actual ECR image URI (e.g. 12345.dkr.ecr.us-east-1.amazonaws.com/prospectly-frontend:latest)
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
          envFrom:
            - configMapRef:
                name: prospectly-frontend-config
            - secretRef:
                name: prospectly-frontend-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
