apiVersion: apps/v1
kind: Deployment
metadata:
  name: prospectly-frontend
  namespace: default
  labels:
    app: prospectly-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: prospectly-frontend
  template:
    metadata:
      labels:
        app: prospectly-frontend
    spec:
      containers:
        - name: prospectly-frontend
          image: 466682667800.dkr.ecr.us-west-1.amazonaws.com/test-vishal-prospectly-frontend:de71e69d5a381cecd81475704b8e0edf31fae3e1
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
          envFrom:
            - configMapRef:
                name: prospectly-frontend-config
            - secretRef:
                name: prospectly-frontend-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
