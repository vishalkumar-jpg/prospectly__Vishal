<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Opening resume…</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        color: #475569;
      }
    </style>
  </head>
  <body>
    <p>Loading resume…</p>
    <script>
      (async function () {
        var params = new URLSearchParams(window.location.search);
        var source = params.get("source");
        var id = params.get("id");
        var path =
          source === "connector-candidate"
            ? "/api/recruitment/connector-pipeline/candidate/" +
              encodeURIComponent(id) +
              "/resume"
            : source === "pool-match"
              ? "/api/recruitment/job-pool-matches/" +
                encodeURIComponent(id) +
                "/resume"
              : null;

        function closeHandoff() {
          window.close();
        }

        function isAllowedUrl(url) {
          try {
            var parsed = new URL(url);
            return parsed.protocol === "https:" || parsed.protocol === "http:";
          } catch (_err) {
            return false;
          }
        }

        if (!path || !id) {
          closeHandoff();
          return;
        }

        try {
          var response = await fetch(path, { credentials: "include" });
          if (!response.ok) {
            closeHandoff();
            return;
          }
          var payload = await response.json();
          var data = payload && payload.data !== undefined ? payload.data : payload;
          var url = data && data.url;
          if (typeof url === "string" && isAllowedUrl(url)) {
            window.location.replace(url);
            return;
          }
        } catch (_err) {
          /* fall through */
        }

        closeHandoff();
      })();
    </script>
  </body>
</html>
