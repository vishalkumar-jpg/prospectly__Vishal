name: Deploy Frontend to Production

on:
  workflow_dispatch:

env:
  APP_NAME: prospectly-frontend

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy Frontend via SSH
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # ─── Deploy to server via SSH ───
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "🚀 Starting frontend deployment..."

            APP_DIR="${{ secrets.APP_DIR || '/opt/prospectly' }}"
            cd "$APP_DIR"

            # ─── Pull latest code ───
            echo "📥 Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            # ─── Create Docker network if not exists ───
            docker network inspect prospectly-prod-net >/dev/null 2>&1 || \
              docker network create prospectly-prod-net

            # ─── Build and deploy frontend ───
            echo "📦 Building frontend image..."
            cd client
            docker compose build --no-cache

            echo "🔄 Restarting frontend..."
            docker compose up -d

            # ─── Wait for health check ───
            echo "⏳ Waiting for frontend to be ready..."
            sleep 5
            for i in $(seq 1 20); do
              if curl -sf http://localhost:3002 > /dev/null 2>&1; then
                echo "✅ Frontend is live!"
                break
              fi
              if [ "$i" -eq 20 ]; then
                echo "❌ Frontend health check failed after 20 attempts"
                docker logs prospectly-frontend --tail 50
                exit 1
              fi
              echo "⏱️ Attempt $i/20 — waiting..."
              sleep 5
            done

            # ─── Cleanup old images ───
            echo "🧹 Cleaning up old images..."
            docker image prune -f

            echo "🎉 Frontend deployment complete!"
