name: Deploy Frontend to Production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build & Push Frontend Image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Decode frontend .env from secret
        env:
          FRONTEND_ENV_BASE64: ${{ secrets.FRONTEND_ENV_BASE64 }}
        run: |
          echo "$FRONTEND_ENV_BASE64" | base64 --decode > client/.env
          echo "✅ Decoded FRONTEND_ENV_BASE64 into client/.env"

      - name: Build, tag, and push frontend image to ECR
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_FRONTEND }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          cd client
          docker build \
            -t "$FULL_IMAGE" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            .

          docker push "$FULL_IMAGE"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

          echo "image=$FULL_IMAGE" >> "$GITHUB_OUTPUT"

  update-gitops:
    name: Update GitOps Manifest
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Clone GitOps repository
        env:
          GIITT_TOKEN: ${{ secrets.GIITT_TOKEN }}
        run: |
          git clone https://x-access-token:${GIITT_TOKEN}@github.com/vishalkumar-jpg/gitops-vishal.git
          cd gitops-vishal
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update frontend deployment image
        env:
          NEW_IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          MANIFEST="gitops-vishal/project-prospectly/production/Frontend/k8s/deployment.yaml"

          echo "Updating image to: $NEW_IMAGE"
          sed -i "s|image: .*|image: $NEW_IMAGE|g" "$MANIFEST"

          cat "$MANIFEST"

      - name: Commit and push to GitOps repo
        run: |
          cd gitops-vishal
          git add project-prospectly/production/Frontend/k8s/deployment.yaml
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore(frontend): update image to ${{ github.sha }}"
          git push origin main
