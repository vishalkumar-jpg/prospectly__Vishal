name: Deploy Frontend to Production

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push frontend image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_FRONTEND }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd client
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Update Kubernetes manifest and push to Git (GitOps)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_FRONTEND }}
          IMAGE_TAG: ${{ github.sha }}
          FRONTEND_ENV_BASE64: ${{ secrets.FRONTEND_ENV_BASE64 }}
        run: |
          # 1. Decode your GitHub Secret into a .env file
          echo "$FRONTEND_ENV_BASE64" | base64 --decode > client/.env
          
          # 2. Automatically inject the K8s secret directly into EKS (Bypassing Git)
          aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name cluster-vishal-eks
          kubectl create secret generic prospectly-frontend-secret --from-env-file=client/.env --dry-run=client -o yaml | kubectl apply -f -
          
          # Update the deployment.yaml with the exact ECR image and commit SHA
          sed -i "s|image: .*|image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG|g" client/k8s/deployment.yaml
          
          # Commit the change
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add client/k8s/deployment.yaml
          git commit -m "Deploy frontend: update image to $IMAGE_TAG" || echo "No changes to commit"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
