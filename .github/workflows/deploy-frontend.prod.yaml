name: Deploy Frontend to Production

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push frontend image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_FRONTEND }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd client
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Update Kubernetes manifest and push to Git (GitOps)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_FRONTEND }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Update the deployment.yaml with the exact ECR image and commit SHA
          sed -i "s|image: .*|image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG|g" client/k8s/deployment.yaml
          
          # Commit the change
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add client/k8s/deployment.yaml
          git commit -m "Deploy frontend: update image to $IMAGE_TAG" || echo "No changes to commit"
          git push
      - name: Deploy Frontend to Server
        uses: appleboy/ssh-action@master
        env:
          FRONTEND_ENV_BASE64: ${{ secrets.FRONTEND_ENV_BASE64 }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY}}
          script_stop: true
          envs: FRONTEND_ENV_BASE64
          script: |
            APP_DIR="/var/www/html/prospectly"
            
            # Ensure the directory exists and the user has permissions
            sudo mkdir -p /var/www/html
            sudo chown -R $USER:$USER /var/www/html
            
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone https://github.com/vishalkumar-jpg/prospectly__Vishal.git "$APP_DIR"
            fi
            
            cd "$APP_DIR"
            
            # Fetch latest changes and reset to the triggered branch
            git fetch origin ${{ github.ref_name }}
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            
            echo "Creating Docker network if it doesn't exist..."
            sudo docker network inspect prospectly-prod-net >/dev/null 2>&1 || \
              sudo docker network create prospectly-prod-net
            
            echo "Building and starting frontend..."
            cd "$APP_DIR/client"
            
            # Decode the base64 secret to a .env file inside the client folder
            echo "$FRONTEND_ENV_BASE64" | base64 --decode > .env
            
            # Run docker compose using the decoded .env
            sudo -E docker compose -f docker-compose.yml up -d --build
            
            echo "Cleaning old images..."
            sudo docker image prune -af
            
            echo "Running containers:"
            sudo docker ps -a
