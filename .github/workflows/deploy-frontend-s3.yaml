name: Deploy Frontend to AWS S3

on:
  push:
    branches:
      - main
    paths:
      - 'client/**'
      - '.github/workflows/deploy-frontend-s3.yaml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Create Frontend .env File
        working-directory: ./client
        run: |
          echo "${{ secrets.FRONTEND_ENV_BASE64 }}" | base64 --decode > .env

      - name: Install Dependencies
        working-directory: ./client
        run: bun install --frozen-lockfile

      - name: Build Frontend
        working-directory: ./client
        # Building for static SPA. Adjust if your Vite config outputs somewhere else.
        run: bun run build:dev # or `bun run build` if you change package.json to just build static

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        working-directory: ./client
        # Dist path is usually dist/ or dist/client based on vite ssr setup
        run: aws s3 sync dist/ s3://${{ secrets.S3_BUCKET_NAME }} --delete

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
          echo "Deployment successful! The frontend is live at http://learning-front.officebrain.com/"
