name: Deploy Backend to Production

on:
  workflow_dispatch:

# ─── Shared env vars for readable, traceable image names ───
env:
  APP_NAME: prospectly-backend
  IMAGE_VERSION: v1.${{ github.run_number }}.0
  SHORT_SHA: ${{ github.sha }}

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build & Push Backend Image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}
      image_tag: ${{ steps.build.outputs.image_tag }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push backend image to ECR
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_BACKEND }}
          SERVER_ENV_BASE64: ${{ secrets.SERVER_ENV_BASE64 }}
        run: |
          # ── Readable image tag: v1.42.0-abc1234 ──
          IMAGE_TAG="${IMAGE_VERSION}-${SHORT_SHA::7}"
          FULL_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "🏷️  Image tag : $IMAGE_TAG"
          echo "📦 Full image: $FULL_IMAGE"

          cd server
          docker build \
            --build-arg SERVER_ENV_BASE64="$SERVER_ENV_BASE64" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.version=${IMAGE_TAG}" \
            --label "org.opencontainers.image.title=${APP_NAME}" \
            -t "${FULL_IMAGE}" \
            -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" \
            .

          docker push "${FULL_IMAGE}"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

          echo "image=${FULL_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

  update-gitops:
    name: Update GitOps Manifest
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Clone GitOps repository
        env:
          GIITT_TOKEN: ${{ secrets.GIITT_TOKEN }}
        run: |
          git clone https://x-access-token:${GIITT_TOKEN}@github.com/vishalkumar-jpg/gitops-vishal.git
          cd gitops-vishal
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update backend deployment image
        env:
          NEW_IMAGE: ${{ needs.build-and-push.outputs.image }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          MANIFEST="gitops-vishal/project-prospectly/production/Backend/k8s/deployment.yaml"

          echo "🔄 Updating backend image to: $NEW_IMAGE"
          echo "🏷️  Tag: $IMAGE_TAG"
          sed -i "s|image: .*|image: $NEW_IMAGE|g" "$MANIFEST"

          echo "───── Updated manifest ─────"
          cat "$MANIFEST"

      - name: Commit and push to GitOps repo
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          cd gitops-vishal
          git add project-prospectly/production/Backend/k8s/deployment.yaml
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "deploy(backend): ${APP_NAME} → ${IMAGE_TAG}"
          git push origin main
