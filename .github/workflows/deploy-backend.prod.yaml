name: Deploy Backend to Production

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push backend image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_BACKEND }}
          IMAGE_TAG: ${{ github.sha }}
          SERVER_ENV_BASE64: ${{ secrets.SERVER_ENV_BASE64 }}
        run: |
          cd server
          docker build --build-arg SERVER_ENV_BASE64="$SERVER_ENV_BASE64" -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Update Kubernetes manifest and push to Git (GitOps)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_BACKEND }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i "s|image: .*|image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG|g" server/k8s/deployment.yaml
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add server/k8s/deployment.yaml
          git commit -m "Deploy backend: update image to $IMAGE_TAG" || echo "No changes to commit"
          git push

      - name: Deploy Backend to Server
        uses: appleboy/ssh-action@master
        env:
          SERVER_ENV_BASE64: ${{ secrets.SERVER_ENV_BASE64 }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY}}
          script_stop: true
          command_timeout: 30m
          envs: SERVER_ENV_BASE64
          script: |
            APP_DIR="/var/www/html/prospectly"
            
            # Ensure the directory exists and the user has permissions
            sudo mkdir -p /var/www/html
            sudo chown -R $USER:$USER /var/www/html
            
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone https://github.com/vishalkumar-jpg/prospectly__Vishal.git "$APP_DIR"
            fi
            
            cd "$APP_DIR"
            
            # Fetch latest changes and reset to the triggered branch
            git fetch origin ${{ github.ref_name }}
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            
            echo "Creating Docker network if it doesn't exist..."
            sudo docker network inspect prospectly-prod-net >/dev/null 2>&1 || \
              sudo docker network create prospectly-prod-net
            
            echo "Checking swap space..."
            if [ $(sudo swapon --show | wc -l) -eq 0 ]; then
              echo "No swap found. Creating a 4GB swap file to prevent out of memory errors..."
              sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
              echo "Swap created!"
            else
              echo "Swap already exists."
            fi
            
            echo "Building and starting server..."
            cd "$APP_DIR/server"
            
            # Decode the base64 secret to a .env file inside the server folder
            echo "$SERVER_ENV_BASE64" | base64 --decode > .env
            
            # Run docker compose using the decoded .env
            sudo -E docker compose -p prospectly-infra -f docker-compose.infra.yml up -d
            sudo -E docker compose -f docker-compose-dev.yml up -d --build
            
            echo "Cleaning old images..."
            sudo docker image prune -af
            
            echo "Running containers:"
            sudo docker ps
