name: Deploy Backend to Production

on:
  workflow_dispatch:

env:
  APP_NAME: prospectly-backend
  IMAGE_TAG: backend-${{ github.sha }}

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy Backend via SSH
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # ─── Deploy to server via SSH ───
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "🚀 Starting backend deployment..."

            APP_DIR="${{ secrets.APP_DIR || '/opt/prospectly' }}"
            cd "$APP_DIR"

            # ─── Pull latest code ───
            echo "📥 Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            # ─── Create Docker network if not exists ───
            docker network inspect prospectly-prod-net >/dev/null 2>&1 || \
              docker network create prospectly-prod-net

            # ─── Start infrastructure if not running ───
            echo "🐘 Ensuring infrastructure is running..."
            cd server
            docker compose -f docker-compose.infra.yml up -d

            # ─── Build and deploy backend ───
            echo "📦 Building backend image..."
            docker compose -f docker-compose-dev.yml build --no-cache

            echo "🔄 Restarting backend services..."
            docker compose -f docker-compose-dev.yml up -d

            # ─── Wait for health check ───
            echo "⏳ Waiting for backend to be healthy..."
            sleep 10
            for i in $(seq 1 30); do
              if curl -sf http://localhost:5001/api/health > /dev/null 2>&1; then
                echo "✅ Backend is healthy!"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "❌ Backend health check failed after 30 attempts"
                docker logs prospectly-dev --tail 50
                exit 1
              fi
              echo "⏱️ Attempt $i/30 — waiting..."
              sleep 5
            done

            # ─── Cleanup old images ───
            echo "🧹 Cleaning up old images..."
            docker image prune -f

            echo "🎉 Backend deployment complete!"
